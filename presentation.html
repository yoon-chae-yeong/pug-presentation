        function contentSlide({ label, title, message, body, scroll = false, wide = false, alignTop = false, compact = false, titleExtra, slideClass = '' }) {
            const scrollCls = scroll ? ' py-12 overflow-y-auto' : '';
            const alignCls = alignTop ? ' justify-start pt-6 pb-16 overflow-hidden' : ' justify-center pb-14';
            const maxW = wide ? 'max-w-6xl' : 'max-w-5xl';
            const titleCls = compact ? 'text-3xl font-extrabold mb-2 leading-tight' : 'text-4xl font-extrabold mb-3';
            const msgMb = compact ? 'mb-4' : 'mb-7';
            const titleBlock = titleExtra
                ? `<div class="slide-title-row shrink-0"><h2 class="${titleCls.replace(' mb-2', '').replace(' mb-3', '')}">${title}</h2>${titleExtra}</div>`
                : `<h2 class="${titleCls} shrink-0">${title}</h2>`;
            const slideExtraCls = slideClass ? ` ${slideClass}` : '';
            return `<section class="slide w-full h-screen flex-col${alignCls} px-8 lg:px-24${scrollCls}${slideExtraCls}">
                <div class="${maxW} w-full mx-auto min-h-0${alignTop ? ' flex flex-col flex-1 overflow-hidden' : ''}">
                    <p class="text-sm font-bold text-pug mb-2 uppercase tracking-wider shrink-0">${label}</p>
                    ${titleBlock}
                    ${message ? `<p class="text-sm text-ink/80 leading-relaxed ${msgMb} max-w-3xl shrink-0">${message}</p>` : ''}
                    <div class="${alignTop ? 'min-h-0 flex-1 overflow-hidden' : ''}">${body}</div>
                </div>
            </section>`;
        }

        function listSlide({ label, title, message, items, highlight, footer, scroll, listLayout, compact, alignTop, wide }) {
            const isGrid = listLayout === 'grid';
            const list = items.map(i => {
                const icon = `<span class="shrink-0 ${isGrid ? 'p-0.5' : 'mt-0.5 p-1'} bg-pug text-ink rounded"><i data-lucide="check" class="${isGrid ? 'w-2.5 h-2.5' : 'w-3 h-3'}"></i></span>`;

                    ? 'flex items-center gap-1.5 text-xs md:text-[0.8125rem] text-ink/85 leading-snug'
                    : 'flex items-start gap-2.5 text-sm text-ink/85';
                return `<li class="${liCls}">${icon}<span>${i}</span></li>`;
            }).join('');
            const listCls = isGrid ? 'list-slide-grid' : 'space-y-3';
            const cardPad = isGrid ? 'p-3' : 'p-6';
            const highlightMt = isGrid ? 'mt-0' : 'mt-5';
            const highlightPad = isGrid ? 'px-3 py-2.5' : 'p-4';
            const highlightText = isGrid ? 'text-xs md:text-sm' : 'text-sm';
            const card = `<div class="bg-card rounded-lg ${cardPad} shrink-0"><ul class="${listCls}">${list}</ul></div>`;
            const highlightBlock = highlight ? `<div class="bg-beige rounded-lg ${highlightPad} ${highlightMt} ${highlightText} text-ink leading-relaxed shrink-0">${highlight}</div>` : '';
            const bodyInner = `${card}${highlightBlock}${footer || ''}`;
            const body = isGrid && footer
                ? `<div class="flex flex-col min-h-0 h-full gap-2.5">${bodyInner}</div>`

        function buildPracticeQaGraphNodes() {
            const qaNodes = PRACTICE_QA_GRAPH_LABELS.map((title, i) => ({
                id: practiceQaNodeId(i),

        function initPracticeQaGraph() {
            stopPracticeQaGraph();
            practiceQaGraphSlide = slides[current];
            const svg = practiceQaGraphSlide?.querySelector('#practice-qa-graph-svg');
            if (!svg) return;

            const { w, h } = PRACTICE_QA_GRAPH_VIEW;
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
            svg.innerHTML = '';

            const pad = 36;
            const cx = w * 0.5;
            const cy = h * 0.5;
            const outerNodes = buildPracticeQaGraphNodes();
            const simNodes = outerNodes.map((n, i) => {
                const angle = (i / outerNodes.length) * Math.PI * 2 - Math.PI / 2;
                const dist = n.type === 'qa' ? 108 + (i % 4) * 12 : 78 + (i % 3) * 8;
                return {
                    ...n,
                    x: cx + Math.cos(angle) * dist,
                    y: cy + Math.sin(angle) * dist * 0.82,
                    vx: 0,
                    vy: 0
                };
            });
            const coreNode = {
                id: PRACTICE_QA_GRAPH_CORE.id,
                type: 'core',
                r: 26,
                x: cx,
                y: cy,
                vx: 0,
                vy: 0,
                fixed: true
            };
            simNodes.push(coreNode);
            const nodeById = Object.fromEntries(simNodes.map(n => [n.id, n]));
            const allLinks = getPracticeQaGraphAllLinks();
            const simLinks = allLinks.map(([a, b]) => ({
                a, b,
                core: a === 'core' || b === 'core',
                qa: a.startsWith('q') && b.startsWith('q'),
                topic: (a.startsWith('t') || b.startsWith('t')) && a !== 'core' && b !== 'core'
            }));

            const linksG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const nodesG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            const coreG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            svg.appendChild(linksG);
            svg.appendChild(nodesG);
            svg.appendChild(coreG);

            const lineEls = simLinks.map(({ a, b, core }) => {
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.dataset.link = `${a}|${b}`;
                line.setAttribute('class', `kg-link${core ? ' is-core-link' : ''}`);
                linksG.appendChild(line);
                return { a, b, el: line };
            });

            const nodeGroups = outerNodes.map(n => {
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.setAttribute('class', `kg-node${n.type === 'topic' ? ' is-topic' : ''}`);
                g.dataset.node = n.id;
                const titleLine = n.type === 'qa'
                    ? `<text class="kg-node-title" dy="24">${n.title}</text>`
                    : '';
                g.innerHTML = `<circle r="${n.r}"></circle>
                    <text class="kg-node-label">${n.label}</text>${titleLine}`;
                if (n.type === 'qa') {
                    g.addEventListener('click', () => selectPracticeQaGraphNode(n.index, true));
                }
                nodesG.appendChild(g);
                return { ...n, g };
            });

            const coreGEl = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            coreGEl.setAttribute('class', 'kg-node is-core');
            coreGEl.dataset.node = 'core';
            coreGEl.innerHTML = `<circle r="${coreNode.r}"></circle>
                <text class="kg-node-label" dy="-0.35em">${PRACTICE_QA_GRAPH_CORE.label}</text>
                <text class="kg-node-label" dy="0.85em">${PRACTICE_QA_GRAPH_CORE.sub}</text>`;
            coreG.appendChild(coreGEl);

            practiceQaGraphSim = { simNodes, simLinks, nodeById, lineEls, nodeGroups, coreGEl, cx, cy, pad, w, h, lastNow: 0 };

            function simulate(now) {
                practiceQaGraphSim.lastNow = now;
                const spread = 0.68 + 0.42 * (0.5 + 0.5 * Math.sin(now * 0.00085));
                const repulse = 4800 * spread * spread;
                const springK = 0.02 / spread;
                const restQa = 76 * spread;
                const restTopic = 46 * spread;
                const restCore = 92 * spread;
                const restMix = 58 * spread;
                const damp = 0.84;
                const outerNodesOnly = simNodes.filter(n => !n.fixed);

                for (let i = 0; i < outerNodesOnly.length; i++) {
                    for (let j = i + 1; j < outerNodesOnly.length; j++) {
                        const a = outerNodesOnly[i];
                        const b = outerNodesOnly[j];
                        let dx = b.x - a.x;
                        let dy = b.y - a.y;
                        let dist = Math.hypot(dx, dy) || 0.01;
                        const force = repulse / (dist * dist);
                        const fx = (dx / dist) * force;
                        const fy = (dy / dist) * force;
                        a.vx -= fx; a.vy -= fy;
                        b.vx += fx; b.vy += fy;
                    }
                }

                simLinks.forEach(({ a, b, core, qa, topic }) => {
                    const na = nodeById[a];
                    const nb = nodeById[b];
                    if (!na || !nb) return;
                    let dx = nb.x - na.x;
                    let dy = nb.y - na.y;
                    let dist = Math.hypot(dx, dy) || 0.01;
                    const rest = core ? restCore : qa ? restQa : topic ? restTopic : restMix;
                    const force = (dist - rest) * springK;
                    const fx = (dx / dist) * force;
                    const fy = (dy / dist) * force;
                    if (!na.fixed) { na.vx += fx; na.vy += fy; }
                    if (!nb.fixed) { nb.vx -= fx; nb.vy -= fy; }
                });

                outerNodesOnly.forEach(n => {
                    n.vx += (cx - n.x) * 0.0025;
                    n.vy += (cy - n.y) * 0.0025;
                    n.vx *= damp;
                    n.vy *= damp;
                    n.x += n.vx;
                    n.y += n.vy;
                    n.x = Math.max(pad, Math.min(w - pad, n.x));
                    n.y = Math.max(pad, Math.min(h - pad, n.y));
                });

                coreNode.x = cx;
                coreNode.y = cy;
                coreNode.vx = 0;
                coreNode.vy = 0;
            }

            function renderGraph() {
                lineEls.forEach(({ a, b, el }) => {
                    const pa = nodeById[a];
                    const pb = nodeById[b];
                    el.setAttribute('x1', pa.x);
                    el.setAttribute('y1', pa.y);
                    el.setAttribute('x2', pb.x);
                    el.setAttribute('y2', pb.y);
                });
                nodeGroups.forEach(n => {
                    const scale = n.type === 'qa' && practiceQaGraphActive === n.index ? 1.12 : 1;
                    n.g.setAttribute('transform', `translate(${n.x}, ${n.y}) scale(${scale})`);
                });
                const pulse = 1 + 0.05 * Math.sin(practiceQaGraphSim.lastNow * 0.0011);
                coreGEl.setAttribute('transform', `translate(${cx}, ${cy}) scale(${pulse})`);
            }

            function tick(now) {
                simulate(now);
                renderGraph();
                practiceQaGraphRaf = requestAnimationFrame(tick);
            }

            selectPracticeQaGraphNode(0, false);
            practiceQaGraphRaf = requestAnimationFrame(tick);

            let cycleIdx = 0;
            practiceQaGraphCycleTimer = setInterval(() => {
                if (performance.now() < practiceQaGraphPausedUntil) return;
                cycleIdx = (cycleIdx + 1) % PRACTICE_QA_ITEMS.length;
                selectPracticeQaGraphNode(cycleIdx, false);
            }, 3200);
        }

        function getGrowthAfter() { return GROWTH.map(g => g.m5); }
        function getAvgDelta(values = growthCurrentValues) {
            return Math.round(GROWTH.reduce((sum, g, i) => sum + (values[i] - g.m3), 0) / GROWTH.length);
        }
        function getFinalAvgDelta() {
            return Math.round(GROWTH.reduce((sum, g) => sum + (g.m5 - g.m3), 0) / GROWTH.length);
        }

        function setRadarModeButtons(mode) {
            document.querySelectorAll('.radar-mode-btn[data-radar-mode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.radarMode === mode);
            });
        }

        function updateGrowthDetailList(activeIdx = activeGrowthIdx) {
            const list = document.getElementById('growth-detail-list');
            const avgEl = document.getElementById('growth-avg-delta');
            if (!list) return;

            const isBefore = growthListMode === 'before';
            if (avgEl) avgEl.textContent = isBefore ? '' : `평균 +${growthListMode === 'after' ? getFinalAvgDelta() : getAvgDelta()}%`;

            list.innerHTML = GROWTH.map((g, i) => {
                const val = Math.round(growthCurrentValues[i]);
                const delta = g.m5 - g.m3;
                const active = i === activeIdx ? ' active' : '';
                const currentDelta = Math.max(0, val - g.m3);
                return `<button type="button" class="growth-dim-row w-full text-left rounded-lg hover:bg-beige transition${active}" data-dim-idx="${i}">
                    <div class="flex justify-between items-center gap-1 text-[11px] font-bold mb-0.5 leading-tight">
                        <span class="truncate">${g.area}</span>
                        <span class="text-pug shrink-0 tabular-nums">${isBefore ? '' : `+${growthListMode === 'after' ? delta : currentDelta}%`}</span>
                    </div>
                    <div class="grid grid-cols-[1fr_auto] items-center gap-1.5 text-[10px]">
                        <div class="h-1.5 bg-beige rounded-full overflow-hidden relative">
                            <div class="absolute inset-y-0 left-0 bg-ink/30 rounded-full" style="width:${g.m3}%"></div>
                            <div class="absolute inset-y-0 left-0 bg-pug rounded-full" style="width:${val}%"></div>
                        </div>
                        <span class="text-ink font-bold w-10 text-right tabular-nums shrink-0">${val}%</span>
                    </div>
                </button>`;
            }).join('');
        }

        function highlightGrowthDimension(idx, { listOnly = false } = {}) {
            activeGrowthIdx = idx;
            updateGrowthDetailList(idx);
            if (!growthRadarInstance || listOnly) return;

            const activeEls = radarMode === 'after'
                ? [{ datasetIndex: 0, index: idx }, { datasetIndex: 1, index: idx }]
                : [{ datasetIndex: 0, index: idx }];
            growthRadarInstance.setActiveElements(activeEls);
            growthRadarInstance.tooltip.setActiveElements(activeEls, { x: 0, y: 0 });
            growthRadarInstance.update('none');
        }

        function resetToBefore() {
            growthListMode = 'before';
            growthCurrentValues = GROWTH.map(g => g.m3);
            activeGrowthIdx = -1;
            radarMode = 'before';
            if (growthRadarInstance) {
                growthRadarInstance.data.datasets[0].hidden = false;
                growthRadarInstance.data.datasets[1].hidden = true;
                growthRadarInstance.data.datasets[1].data = getGrowthAfter();
                growthRadarInstance.update();
            }
            setRadarModeButtons('before');
            updateGrowthDetailList(-1);
        }

        function stopRadarAutoLoop() {
            if (radarAutoTimer) {
                clearTimeout(radarAutoTimer);
                radarAutoTimer = null;
            }
        }

        function stopRadarSlide() {
            stopRadarAutoLoop();
            stopGrowthAnimation();
        }

        function startRadarAutoLoop() {
            stopRadarAutoLoop();
            resetToBefore();

            function showAfter() {
                playGrowthAnimation(() => {
                    radarAutoTimer = setTimeout(showBefore, RADAR_HOLD_AFTER);
                });
            }

            function showBefore() {
                resetToBefore();
                radarAutoTimer = setTimeout(showAfter, RADAR_HOLD_BEFORE);
            }

            radarAutoTimer = setTimeout(showAfter, RADAR_HOLD_BEFORE);
        }

        function stopGrowthAnimation() {
            if (radarAnimFrame) {
                cancelAnimationFrame(radarAnimFrame);
                radarAnimFrame = null;
            }
            radarAnimating = false;
        }

        function playGrowthAnimation(onComplete) {
            if (!growthRadarInstance || radarAnimating) return;
            stopGrowthAnimation();

            growthListMode = 'animating';
            growthCurrentValues = GROWTH.map(g => g.m3);
            activeGrowthIdx = -1;
            radarMode = 'after';
            setRadarModeButtons('after');

            growthRadarInstance.data.datasets[0].hidden = false;
            growthRadarInstance.data.datasets[1].hidden = false;
            growthRadarInstance.data.datasets[1].data = [...getGrowthBefore()];
            growthRadarInstance.update('none');
            updateGrowthDetailList(-1);

            const before = getGrowthBefore();
            const after = getGrowthAfter();
            const duration = RADAR_GROWTH_DURATION;
            const start = performance.now();
            radarAnimating = true;

            function frame(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                growthCurrentValues = before.map((b, i) => Math.round(b + (after[i] - b) * eased));
                growthRadarInstance.data.datasets[1].data = [...growthCurrentValues];
                growthRadarInstance.update('none');
                updateGrowthDetailList(-1);

                if (t < 1) {
                    radarAnimFrame = requestAnimationFrame(frame);
                } else {
                    growthListMode = 'after';
                    growthCurrentValues = [...after];
                    growthRadarInstance.data.datasets[1].data = [...after];
                    growthRadarInstance.update();
                    radarAnimating = false;
                    radarAnimFrame = null;
                    activeGrowthIdx = -1;
                    updateGrowthDetailList(-1);
                    if (onComplete) onComplete();
                }
            }

            radarAnimFrame = requestAnimationFrame(frame);
        }

        function renderGrowthRadar() {
            const canvas = document.getElementById('growthRadar');
            if (!canvas || typeof Chart === 'undefined') return;

            if (growthRadarInstance) {
                growthRadarInstance.resize();

                        { label: 'After', data: getGrowthAfter(), hidden: true, fill: true, backgroundColor: 'rgba(245,176,65,0.35)', borderColor: 'rgba(245,176,65,1)', pointBackgroundColor: 'rgba(245,176,65,1)', pointBorderColor: '#33271F', borderWidth: 3, pointRadius: 4, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#33271F',
                            titleColor: '#FFFFFF',
                            bodyColor: '#F0EAE0',
                            padding: 12,
                            callbacks: {
                                label(ctx) {
                                    return `${ctx.dataset.label}: ${ctx.raw}%`;
                                },
                                afterBody(items) {
                                    const before = items.find(i => i.dataset.label === 'Before');
                                    const after = items.find(i => i.dataset.label === 'After');
                                    if (before && after) return [`변화: +${after.raw - before.raw}%`];
                                    return [];
                                }
                            }
                        }
                    },
                    scales: {
                        r: {
                            min: 0, max: 100,
                            angleLines: { color: 'rgba(51,39,31,0.12)' },
                            grid: { color: 'rgba(51,39,31,0.12)' },
                            pointLabels: { color: '#33271F', font: { family: 'Noto Sans KR', size: 10, weight: 'bold' } },
                            ticks: { backdropColor: 'transparent', color: '#8A7B6E', font: { size: 10 }, stepSize: 20 }
                        }
                    },
                    onHover(_evt, elements) {
                        if (elements.length && elements[0].index !== activeGrowthIdx) {
                            highlightGrowthDimension(elements[0].index);
                        }
                    },
                    onClick(_evt, elements) {
                        if (elements.length) highlightGrowthDimension(elements[0].index);
                    }
                }
            });

            updateGrowthDetailList();
            resetToBefore();
        }

        function destroyMemberRadars() {
            stopMemberRadarSlide();
            memberRadarInstances.forEach(c => c.destroy());
            memberRadarInstances = [];
        }

        function resetMemberRadarsToBefore() {
            memberRadarInstances.forEach((chart, i) => {
                chart.data.datasets[0].hidden = false;
                chart.data.datasets[1].hidden = true;
                chart.data.datasets[1].data = [...MEMBER_GROWTH[i].before];
                chart.update();

        function stopMemberRadarAnimation() {
            if (memberRadarAnimFrame) {
                cancelAnimationFrame(memberRadarAnimFrame);
                memberRadarAnimFrame = null;
            }
            memberRadarAnimating = false;
        }

        function stopMemberRadarAutoLoop() {
            if (memberRadarAutoTimer) {
                clearTimeout(memberRadarAutoTimer);
                memberRadarAutoTimer = null;
            }
        }

        function stopMemberRadarSlide() {
            stopMemberRadarAutoLoop();
            stopMemberRadarAnimation();
        }

        function playMemberRadarAnimation(onComplete) {
            if (!memberRadarInstances.length || memberRadarAnimating) return;
            stopMemberRadarAnimation();

            memberRadarInstances.forEach((chart, i) => {
                chart.data.datasets[0].hidden = false;
                chart.data.datasets[1].hidden = false;
                chart.data.datasets[1].data = [...MEMBER_GROWTH[i].before];
                chart.update('none');
            });

            const start = performance.now();
            memberRadarAnimating = true;

            function frame(now) {
                const t = Math.min(1, (now - start) / RADAR_GROWTH_DURATION);
                const eased = 1 - Math.pow(1 - t, 3);
                memberRadarInstances.forEach((chart, i) => {
                    const before = MEMBER_GROWTH[i].before;
                    const after = MEMBER_GROWTH[i].after;
                    chart.data.datasets[1].data = before.map((b, j) => Math.round(b + (after[j] - b) * eased));
                    chart.update('none');
                });
                if (t < 1) {
                    memberRadarAnimFrame = requestAnimationFrame(frame);
                } else {
                    memberRadarInstances.forEach((chart, i) => {
                        chart.data.datasets[1].data = [...MEMBER_GROWTH[i].after];
                        chart.update();
                    });
                    memberRadarAnimating = false;
                    onComplete?.();
                }
            }
            memberRadarAnimFrame = requestAnimationFrame(frame);
        }

        function startMemberRadarAutoLoop() {
            stopMemberRadarAutoLoop();
            resetMemberRadarsToBefore();

            function showAfter() {
                playMemberRadarAnimation(() => {
                    memberRadarAutoTimer = setTimeout(showBefore, RADAR_HOLD_AFTER);
                });
            }

            function showBefore() {
                resetMemberRadarsToBefore();
                memberRadarAutoTimer = setTimeout(showAfter, RADAR_HOLD_BEFORE);

            memberRadarAutoTimer = setTimeout(showAfter, RADAR_HOLD_BEFORE);
        }

            MEMBER_GROWTH.forEach((m, i) => {

                            { label: 'After', data: [...m.before], hidden: true, fill: true, backgroundColor: 'rgba(245,176,65,0.40)', borderColor: 'rgba(245,176,65,1)', pointBackgroundColor: 'rgba(245,176,65,1)', pointBorderColor: '#33271F', borderWidth: 2, pointRadius: 1.5, pointHoverRadius: 3 }

        const EMBED_SCROLL_SELECTOR = '.embed-scroll-iframe';
        const CONVENTION_GUIDE_SELECTOR = '.week-guide-embed--convention .week-guide-iframe';
        const CONVENTION_DEFAULT_TAB = 'git';
        const EMBED_SCROLL_SPEED = 220;
        const EMBED_SCROLL_START_PAUSE_MS = 80;
        const EMBED_SCROLL_SETTLE_MS = 320;
        const EMBED_SCROLL_STEP_PX = 240;
        const EMBED_SCROLL_STEP_PAUSE_MS = 480;
        const EMBED_SCROLL_TURN_PAUSE_MS = 650;
        const EMBED_SCROLL_READY_TIMEOUT_MS = 4000;
        let embedScrollRaf = null;
        let embedScrollState = null;
        let embedScrollStartTimer = null;
        let embedScrollReadyTimer = null;
        let activeEmbedIframe = null;
        let embedScrollMode = null;
        let embedScrollMessageHandler = null;

        function getEmbedScrollContainer(iframe) {
            return iframe.closest('.week-guide-embed__scaler, .design-guide-scaler, .notion-embed-wrap') || iframe.parentElement;
        }

        function postEmbedScrollMessage(iframe, action) {
            if (!iframe) return;
            try {
                iframe.contentWindow?.postMessage({
                    type: 'pug-embed-scroll',
                    action,
                    speed: EMBED_SCROLL_SPEED,
                    pause: EMBED_SCROLL_TURN_PAUSE_MS,
                    startPause: EMBED_SCROLL_START_PAUSE_MS,
                    stepPx: EMBED_SCROLL_STEP_PX,
                    stepPause: EMBED_SCROLL_STEP_PAUSE_MS
                }, '*');
            } catch (_) {}
        }

        function layoutEmbedFromReport(iframe, contentHeight) {
            if (!contentHeight || contentHeight < 80) return null;
            try {
                iframe.style.height = `${Math.ceil(contentHeight)}px`;
                iframe.style.width = '100%';
                iframe.style.display = 'block';
                const container = getEmbedScrollContainer(iframe);
                if (!container || container.clientHeight < 40) return null;
                void iframe.offsetHeight;
                void container.offsetHeight;
                const maxScroll = Math.max(0, container.scrollHeight - container.clientHeight);
                if (maxScroll < 16) return null;
                return { container, iframe, maxScroll };
            } catch (_) {
                return null;
            }
        }

        function setEmbedScrollPosition(prep, pos) {
            prep.container.scrollTop = pos;
        }

        function stopParentEmbedScrollLoop() {
            if (embedScrollRaf) {
                cancelAnimationFrame(embedScrollRaf);
                embedScrollRaf = null;
            }
            embedScrollState = null;
            if (embedScrollMode === 'parent') embedScrollMode = null;
        }

        function detachEmbedScrollListener() {
            if (embedScrollMessageHandler) {
                window.removeEventListener('message', embedScrollMessageHandler);
                embedScrollMessageHandler = null;
            }
        }

        function stopEmbedAutoScroll() {
            if (embedScrollStartTimer) {
                clearTimeout(embedScrollStartTimer);
                embedScrollStartTimer = null;
            }
            if (embedScrollReadyTimer) {
                clearTimeout(embedScrollReadyTimer);
                embedScrollReadyTimer = null;
            }
            detachEmbedScrollListener();
            stopParentEmbedScrollLoop();
            if (activeEmbedIframe) {
                postEmbedScrollMessage(activeEmbedIframe, 'stop');
                activeEmbedIframe = null;
            }
            embedScrollMode = null;
        }

        function startIframeEmbedScroll(iframe) {
            activeEmbedIframe = iframe;
            embedScrollMode = 'iframe';
            postEmbedScrollMessage(iframe, 'start');
            return true;
        }

        function nextEmbedStepTarget(pos, maxScroll, stepPx) {
            return Math.min(maxScroll, pos + stepPx);
        }

        function runEmbedStepScrollTick(s, ts, maxScroll, applyPos) {
            if (ts < s.pauseUntil) return;

            if (s.resetPending) {
                s.resetPending = false;
                s.pos = 0;
                applyPos(0);
                s.stepTarget = Math.min(s.stepPx, maxScroll);
                s.lastTs = ts;
                return;
            }

            const dt = Math.min(ts - s.lastTs, 48) / 1000;
            s.lastTs = ts;
            s.pos += EMBED_SCROLL_SPEED * dt;

            if (s.pos < s.stepTarget) {
                applyPos(s.pos);
                return;
            }

            s.pos = Math.min(s.pos, s.stepTarget);
            applyPos(s.pos);

            if (s.pos >= maxScroll - 0.5) {
                s.pos = maxScroll;
                applyPos(s.pos);
                s.resetPending = true;
                s.pauseUntil = ts + EMBED_SCROLL_TURN_PAUSE_MS;
            } else {
                s.stepTarget = nextEmbedStepTarget(s.pos, maxScroll, s.stepPx);
                s.pauseUntil = ts + s.stepPause;
            }
        }

        function startParentEmbedScroll(iframe, contentHeight) {
            stopParentEmbedScrollLoop();
            const prep = layoutEmbedFromReport(iframe, contentHeight);
            if (!prep) return false;

            prep.container.scrollTop = 0;
            activeEmbedIframe = iframe;
            embedScrollMode = 'parent';

            embedScrollState = {
                prep,
                pos: 0,
                resetPending: false,
                stepPx: EMBED_SCROLL_STEP_PX,
                stepPause: EMBED_SCROLL_STEP_PAUSE_MS,
                stepTarget: Math.min(EMBED_SCROLL_STEP_PX, prep.maxScroll),
                pauseUntil: performance.now() + EMBED_SCROLL_START_PAUSE_MS,
                lastTs: performance.now()
            };

            const tick = (ts) => {
                const s = embedScrollState;
                if (!s || s.prep.iframe !== iframe || embedScrollMode !== 'parent') return;

                s.prep.maxScroll = Math.max(0, s.prep.container.scrollHeight - s.prep.container.clientHeight);
                if (s.prep.maxScroll < 16) return;

                runEmbedStepScrollTick(s, ts, s.prep.maxScroll, (pos) => setEmbedScrollPosition(s.prep, pos));
                embedScrollRaf = requestAnimationFrame(tick);
            };

            embedScrollRaf = requestAnimationFrame(tick);
            return true;
        }

        function beginEmbedAutoScroll(iframe, contentHeight) {
            if (!slides[current]?.contains(iframe)) return false;
            if (startParentEmbedScroll(iframe, contentHeight)) return true;
            return startIframeEmbedScroll(iframe);
        }

        function initConventionGuideTab() {
            const iframe = slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR);
            if (!iframe) return;

            const send = () => {
                try {
                    iframe.contentWindow?.postMessage({
                        type: 'pug-convention-tab',
                        tab: CONVENTION_DEFAULT_TAB
                    }, '*');
                } catch (_) {}
            };

            send();
            setTimeout(send, 120);

            if (iframe.dataset.conventionTabBound !== '1') {
                iframe.dataset.conventionTabBound = '1';
                iframe.addEventListener('load', send);
            }
        }

        function initEmbedAutoScroll() {
            const iframe = slides[current]?.querySelector(EMBED_SCROLL_SELECTOR);
            if (!iframe) return;

            stopEmbedAutoScroll();

            let started = false;
            const startOnce = (contentHeight) => {
                if (started || !slides[current]?.contains(iframe)) return;
                started = true;
                if (embedScrollReadyTimer) {
                    clearTimeout(embedScrollReadyTimer);
                    embedScrollReadyTimer = null;
                }
                embedScrollStartTimer = setTimeout(() => {
                    embedScrollStartTimer = null;
                    beginEmbedAutoScroll(iframe, contentHeight);
                }, EMBED_SCROLL_SETTLE_MS);
            };

            embedScrollMessageHandler = (e) => {
                const d = e.data;
                if (!d || d.type !== 'pug-embed-scroll' || d.action !== 'ready') return;
                if (e.source !== iframe.contentWindow) return;
                startOnce(d.contentHeight);
            };
            window.addEventListener('message', embedScrollMessageHandler);

            const requestReady = () => postEmbedScrollMessage(iframe, 'request-ready');

            if (iframe.dataset.embedScrollBound !== '1') {
                iframe.dataset.embedScrollBound = '1';
                iframe.addEventListener('load', requestReady);
            }

            requestReady();

            embedScrollReadyTimer = setTimeout(() => {
                embedScrollReadyTimer = null;
                if (!started && slides[current]?.contains(iframe)) {
                    startOnce(null);
                }
            }, EMBED_SCROLL_READY_TIMEOUT_MS);
        }

        function render() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === current);
            });
            stopEmbedAutoScroll();
            manageSlideVideos();
            if (!slides[current]?.querySelector('#growthRadar')) stopRadarSlide();
            if (!slides[current]?.querySelector('#tech-stack-panel')) stopStackAutoLoop();
            if (!slides[current]?.querySelector('#pain-review-grid')) resetPainReveal();
            if (!slides[current]?.querySelector('#meeting-reveal')) resetMeetingReveal();
            if (!slides[current]?.querySelector('#member-radar-grid')) destroyMemberRadars();
            if (!slides[current]?.querySelector('#checklist-panel')) stopChecklistAutoLoop();
            if (!slides[current]?.querySelector('#practice-qa-graph-svg')) stopPracticeQaGraph();
            document.getElementById('cur').innerText = current + 1;
            document.getElementById('progress-bar').style.width = ((current + 1) / slides.length * 100) + '%';
            lucide.createIcons();
            if (slides[current]?.querySelector('#growthRadar')) {
                renderGrowthRadar();
                initGrowthInteractive();
                growthRadarInstance?.resize();
                startRadarAutoLoop();
            } else if (slides[current]?.querySelector('#checklist-body')) {
                renderChecklistBody();
                initChecklistInteractive();
            } else if (slides[current]?.querySelector('#tech-stack-panel')) {
                initTechStackInteractive();
            } else if (slides[current]?.querySelector('#pain-review-grid')) {
                initPainReveal();
            } else if (slides[current]?.querySelector('#meeting-reveal')) {
                initMeetingReveal();
            } else if (slides[current]?.querySelector('#member-radar-grid')) {
                renderMemberRadars();
                startMemberRadarAutoLoop();
            } else if (slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR)) {
                initConventionGuideTab();
            } else if (slides[current]?.querySelector('#practice-qa-graph-svg')) {
                initPracticeQaGraph();
            } else if (slides[current]?.querySelector(EMBED_SCROLL_SELECTOR)) {
                initEmbedAutoScroll();
            }
        }
        function changeSlide(dir) {
            const next = current + dir;
            if (next < 0 || next >= slides.length) return;
            current = next; render();
        }
        document.addEventListener('keydown', e => {
            if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); changeSlide(1); }
            else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); changeSlide(-1); }
            else if (e.key === 'Home') { current = 0; render(); }
            else if (e.key === 'End') { current = slides.length - 1; render(); }
        });
        render();
    </script>
</body>
</html>
