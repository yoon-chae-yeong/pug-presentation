<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PUG 성장 히스토리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#FBF8F3', card: '#FFFFFF', beige: '#F0EAE0',
                        ink: '#33271F', taupe: '#8A7B6E', pug: '#F5B041'
                    },
                    borderRadius: { lg: '8px' }
                }
            }
        };
    </script>
    <style>
        body { font-family: 'Inter', 'Noto Sans KR', sans-serif; }
        .slide { display: none; animation: fade 0.35s ease; }
        .slide.active { display: flex; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .tbl { width: 100%; border-collapse: collapse; }
        .tbl thead th { background: #F0EAE0; color: #33271F; font-weight: 700; font-size: 0.82rem; text-align: left; padding: 0.7rem 1rem; }
        .tbl thead th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .tbl thead th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        .tbl tbody td { padding: 0.7rem 1rem; font-size: 0.85rem; color: #4A3C33; vertical-align: top; border-top: 1px solid #F0EAE0; }
        .tbl tbody td:first-child { color: #33271F; font-weight: 600; }
        .tbl.nowrap-first tbody td:first-child { white-space: nowrap; }
        .col-2026 { color: #33271F !important; font-weight: 600 !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F0EAE0; }
        ::-webkit-scrollbar-thumb { background: #CBBBA8; border-radius: 4px; }
        .slide-media { width: 100%; max-height: 420px; display: block; background: #F0EAE0; object-fit: contain; }
        .slide-media-tall { width: 100%; max-height: calc(100vh - 140px); min-height: 560px; display: block; background: #F0EAE0; object-fit: contain; }
        .slide-photo { width: 100%; height: 220px; display: block; object-fit: cover; background: #F0EAE0; }
        .photo-grid--dense .slide-photo { height: 168px; }
        .photo-grid--dense figcaption { padding-top: 0.4rem; padding-bottom: 0.55rem; }
        .radar-mode-btn { padding: 0.45rem 0.9rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 700; color: #8A7B6E; background: #F0EAE0; transition: all 0.2s; }
        .radar-mode-btn:hover { color: #33271F; }
        .radar-mode-btn.active { background: #33271F; color: #FFFFFF; }
        .growth-dim-row.active { background: #F0EAE0; box-shadow: inset 0 0 0 2px #F5B041; }
        .teams-channel { background: #F5F5F5; border: 1px solid #E1DFDD; border-radius: 4px; padding: 10px; font-family: 'Segoe UI', 'Noto Sans KR', sans-serif; color: #242424; }
        .teams-post { background: #FFFFFF; border: 1px solid #EDEBE9; border-radius: 2px; padding: 10px 12px 8px; }
        .teams-post__header { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
        .teams-avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: #C8C6C4; }
        .teams-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .teams-post__author { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; line-height: 1.15; }
        .teams-presence { display: inline-flex; align-items: center; justify-content: center; width: 12px; height: 12px; border-radius: 50%; background: #6BB700; color: #fff; font-size: 8px; font-weight: 700; }
        .teams-post__meta { margin-top: 1px; font-size: 11px; color: #616161; }
        .teams-post__title { font-size: 13px; font-weight: 700; margin: 0 0 4px; line-height: 1.35; }
        .teams-post__intro { font-size: 11.5px; line-height: 1.4; margin: 0 0 8px; color: #242424; }
        .teams-post__divider { border: none; border-top: 1px solid #EDEBE9; margin: 0 0 8px; }
        .teams-table-title { font-size: 11.5px; font-weight: 700; margin: 0 0 5px; }
        .teams-table { width: 100%; border-collapse: collapse; font-size: 10.5px; line-height: 1.32; }
        .teams-table th, .teams-table td { border: 1px solid #EDEBE9; padding: 3px 6px; vertical-align: top; text-align: left; }
        .tech-stack-main .teams-channel,
        .tech-stack-main .teams-post,
        .tech-stack-main .teams-post__body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .tech-stack-main .teams-table-wrap { flex: 1; min-height: 380px; display: flex; }
        .tech-stack-main .teams-table { flex: 1; height: 100%; table-layout: fixed; font-size: 10.5px; line-height: 1.4; }
        .tech-stack-main .teams-table th,
        .tech-stack-main .teams-table td { padding: 7px 8px; vertical-align: middle; }
        .tech-stack-main .teams-table tbody tr { height: calc(100% / 12); }
        .teams-table th { background: #F3F2F1; font-weight: 700; color: #242424; }
        .teams-table td:first-child { font-weight: 700; white-space: nowrap; width: 96px; }
        .teams-table td:nth-child(2) { width: 132px; }
        .teams-table code { background: #F3F2F1; padding: 0 4px; border-radius: 2px; font-family: Consolas, 'Courier New', monospace; font-size: 10px; }
        .teams-table tbody tr { transition: background 0.25s; }
        .teams-table tbody tr.stack-row-active { background: rgba(245, 176, 65, 0.18); }
        .stack-tab { padding: 0.5rem 0.65rem; border-radius: 8px; font-size: 0.72rem; font-weight: 700; color: #8A7B6E; background: #F0EAE0; transition: all 0.2s; text-align: center; width: 100%; }
        .stack-tab:hover { color: #33271F; }
        .stack-tab.active { background: #33271F; color: #FFFFFF; }
        .stack-item { padding: 0.55rem 0.7rem; border-radius: 8px; background: #FBF8F3; border: 1px solid #F0EAE0; cursor: default; min-height: 44px; box-sizing: border-box; }
        .stack-item:hover { border-color: #F5B041; }
        .stack-item--empty { visibility: hidden; border-color: transparent; background: transparent; }
        .stack-item__name { font-size: 0.78rem; font-weight: 700; color: #33271F; line-height: 1.25; }
        .stack-item__desc { font-size: 0.66rem; color: #8A7B6E; margin-top: 2px; line-height: 1.3; min-height: 1.3em; }
        .stack-tag { display: inline-block; font-size: 0.6rem; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #F5B041; color: #33271F; margin-left: 4px; vertical-align: middle; }
        .stack-panel { display: flex; flex-direction: column; }
        .stack-panel-detail-wrap { position: relative; height: 392px; flex-shrink: 0; }
        .stack-panel-view { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 0.4rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .stack-panel-view.active { opacity: 1; pointer-events: auto; }
        .stack-panel-summary { font-size: 0.68rem; color: #8A7B6E; margin: 0 0 0.35rem; min-height: 1.1rem; flex-shrink: 0; }
        .tech-stack-layout { align-items: stretch; }
        .tech-stack-main { display: flex; }
        .tech-stack-main .teams-channel { flex: 1; width: 100%; }
        .tech-stack-side { display: flex; }
        .tech-stack-side .stack-panel { flex: 1; width: 100%; }
    </style>
</head>
<body class="bg-paper text-ink antialiased overflow-hidden">

    <div class="fixed top-0 left-0 right-0 h-1 bg-beige z-50">
        <div id="progress-bar" class="h-full bg-pug transition-all duration-300" style="width:0%"></div>
    </div>

    <main id="deck" class="w-full h-screen"></main>

    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-card rounded-full px-3 py-2">
        <button onclick="changeSlide(-1)" class="p-2 rounded-full hover:bg-beige text-ink transition" aria-label="이전">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <span class="text-sm font-semibold text-ink tabular-nums px-1">
            <span id="cur">1</span><span class="text-taupe"> / <span id="total">0</span></span>
        </span>
        <button onclick="changeSlide(1)" class="p-2 rounded-full hover:bg-beige text-ink transition" aria-label="다음">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
    </div>

    <div class="fixed top-5 left-6 z-40 flex items-center gap-2 text-sm font-bold text-ink/70">
        <span class="bg-pug text-ink px-2 py-0.5 rounded text-xs">🐶 PUG</span>
        <span class="hidden md:inline">AI PUG 성장 히스토리</span>
    </div>

    <script>
        const deck = document.getElementById('deck');

        // ── Slide builders ──
        function sectionDivider(part, title, subtitle) {
            return `<section class="slide w-full h-screen flex-col items-center justify-center px-8">
                <div class="max-w-3xl w-full text-center flex flex-col items-center gap-6">
                    <div class="inline-flex items-center gap-2 bg-ink text-card px-4 py-2 rounded-lg text-sm font-bold">${part}</div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-tight">${title}</h1>
                    ${subtitle ? `<p class="text-base text-taupe max-w-xl leading-relaxed">${subtitle}</p>` : ''}
                </div>
            </section>`;
        }

        function contentSlide({ label, title, message, body, scroll = false, wide = false }) {
            const scrollCls = scroll ? ' py-12 overflow-y-auto' : '';
            const maxW = wide ? 'max-w-6xl' : 'max-w-5xl';
            return `<section class="slide w-full h-screen flex-col justify-center px-8 lg:px-24${scrollCls}">
                <div class="${maxW} w-full mx-auto">
                    <p class="text-sm font-bold text-pug mb-2 uppercase tracking-wider">${label}</p>
                    <h2 class="text-4xl font-extrabold mb-3">${title}</h2>
                    ${message ? `<p class="text-sm text-ink/80 leading-relaxed mb-7 max-w-3xl">${message}</p>` : ''}
                    ${body}
                </div>
            </section>`;
        }

        function listSlide({ label, title, message, items, highlight }) {
            const list = items.map(i => `<li class="flex items-start gap-2.5 text-sm text-ink/85"><span class="mt-0.5 shrink-0 p-1 bg-pug text-ink rounded"><i data-lucide="check" class="w-3 h-3"></i></span><span>${i}</span></li>`).join('');
            return contentSlide({
                label, title, message,
                body: `<div class="bg-card rounded-lg p-6"><ul class="space-y-3">${list}</ul></div>
                    ${highlight ? `<div class="bg-beige rounded-lg p-4 mt-5 text-sm text-ink leading-relaxed">${highlight}</div>` : ''}`
            });
        }

        function weekSlide({ week, title, topics }) {
            const chips = topics.map(t => `<span class="inline-block bg-beige text-ink text-xs font-medium px-3 py-1.5 rounded-lg mr-2 mb-2">${t}</span>`).join('');
            return contentSlide({
                label: `Education · ${week}`,
                title,
                body: `<div class="bg-card rounded-lg p-8"><div class="flex flex-wrap gap-1">${chips}</div></div>`
            });
        }

        // ── PART 1: PUG 출범, 2025 활동 + 회고 ──
        const part1 = [
            // Cover
            `<section class="slide active w-full h-screen flex-col items-center justify-center px-8">
                <div class="max-w-3xl w-full text-center flex flex-col items-center gap-7">
                    <div class="inline-flex items-center gap-2 bg-pug text-ink px-4 py-2 rounded-lg text-sm font-bold">🐶 AI Power User Group</div>
                    <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight leading-tight">AI PUG<br>성장 히스토리</h1>
                    <p class="text-base text-taupe max-w-2xl leading-relaxed">사내 AI 활용 역량을 높이고, 현업 중심의 AI 실험과<br>지식 공유 문화를 확산해온 AI PUG의 여정.</p>
                </div>
            </section>`,

            sectionDivider('PART 1', 'PUG 출범, 2025 활동 + 회고', '어떻게 시작했고, 무엇이 부족했는가'),

            contentSlide({
                label: 'PUG 소개 · Opening',
                title: 'AI PUG의 시작: AI 활용을 함께 고민하다',
                message: 'AI 활용에 대한 관심은 높아졌지만, 실제 업무에 어떻게 적용할지는 각자 막막한 상황이었습니다. AI PUG는 이런 고민을 함께 풀어가기 위해 시작된 <strong class="text-ink">자발적 학습·공유 그룹</strong>이었습니다.',
                body: `<div class="grid lg:grid-cols-5 gap-6 items-start">
                    <div class="lg:col-span-3 bg-card rounded-lg p-6"><table class="tbl nowrap-first"><tbody>
                        <tr><td>출범</td><td>2025년 7월</td></tr>
                        <tr><td>그룹명</td><td>AI Power User Group</td></tr>
                        <tr><td>목적</td><td>사내 AI 활용 역량 강화 및 자발적 지식 공유 문화 확산</td></tr>
                        <tr><td>운영 방식</td><td>정기 모임, AI 활용 사례 공유, 실습 중심 활동</td></tr>
                        <tr><td>출발점</td><td>AI를 실제 업무에 활용하고 싶은 구성원들의 자발적 참여</td></tr>
                    </tbody></table></div>
                    <div class="lg:col-span-2 bg-pug text-ink rounded-lg p-6 self-stretch flex flex-col justify-center">
                        <p class="text-xs font-bold uppercase tracking-wider mb-3 opacity-70">출발 질문</p>
                        <p class="text-xl font-bold leading-snug">"AI, 우리 업무에<br>어떻게 써볼 수 있을까?"</p>
                    </div></div>`
            }),

            contentSlide({
                label: 'PUG 소개 · 역할',
                title: 'AI를 \'활용하는 조직\'으로 전환하기 위한 실험실',
                body: `<div class="bg-pug text-ink rounded-lg p-4 mb-5 flex items-start gap-3">
                    <i data-lucide="lightbulb" class="w-6 h-6 shrink-0"></i>
                    <p class="text-base font-bold">AI를 '도입'하는 조직이 아니라, '활용하는 조직'으로 전환하기 위한 실험실</p>
                </div>
                <div class="bg-card rounded-lg p-5 mb-5 flex justify-center">
                    <img src="assets/pug-roles.png" alt="PUG 5가지 역할" class="w-full max-w-3xl h-auto">
                </div>
                <div class="grid md:grid-cols-3 gap-3 mb-5">
                    <div class="bg-card rounded-lg px-4 py-3 text-xs font-medium">실습 중심 학습 <span class="text-taupe">(바이브 코딩, LLM API)</span></div>
                    <div class="bg-card rounded-lg px-4 py-3 text-xs font-medium">현업 중심 자동화·개발 프로젝트</div>
                    <div class="bg-card rounded-lg px-4 py-3 text-xs font-medium">지식 교류 & 협업 네트워크 구축</div>
                </div>
                <div class="bg-ink text-card rounded-lg p-4 text-base font-bold">
                    PUG는 DRB의 <span class="text-pug">AI 실험 샌드박스</span>이자, <span class="text-pug">조직문화 변화의 파일럿 그룹</span>
                </div>`,
                scroll: true
            }),

            contentSlide({
                label: '2025 Review · 활동 히스토리',
                title: '2025년 활동 히스토리',
                message: '최신 도구를 직접 실습하고 활용 경험을 공유하는 방식으로 운영되었습니다.',
                body: `<div class="bg-card rounded-lg p-6"><table class="tbl">
                    <thead><tr><th>월</th><th>주요 활동</th><th>키워드</th></tr></thead>
                    <tbody>
                        <tr><td>7월</td><td>PUG 출범, 운영 방안 기획 및 검토</td><td>Kick-off</td></tr>
                        <tr><td>8월</td><td>1차 정기 미팅: AI 활용 현황 공유</td><td>협업, 보안, RPA</td></tr>
                        <tr><td>9월</td><td>VSCode + Copilot 실습</td><td>바이브 코딩</td></tr>
                        <tr><td>9월</td><td>Gemini API 실습</td><td>LLM API</td></tr>
                        <tr><td>10월</td><td>실무 사례 발표 및 회고</td><td>실습 회고, 운영 전환</td></tr>
                    </tbody>
                </table></div>
                <div class="bg-beige rounded-lg p-4 mt-5 text-sm">주요 성과: AI 도구 활용 경험 공유, 바이브 코딩·LLM API 실습, RPA·AI 시스템 아이디어 발굴, 협업 네트워크 형성, <strong class="text-ink">AI NOW</strong> 전사 공유</div>`
            }),

            contentSlide({
                label: '2025 Review · 회고',
                title: '2025년 활동 문제점 & 운영 이슈 회고',
                message: '2025년 PUG는 AI 학습과 공유 문화를 만드는 데 의미가 있었지만, 활동이 <strong class="text-ink">현업 성과로 연결되기에는 몇 가지 한계</strong>가 있었습니다.',
                body: `<div class="bg-card rounded-lg p-6"><table class="tbl">
                    <thead><tr><th>2025년 활동</th><th>드러난 Pain Point</th></tr></thead>
                    <tbody>
                        <tr><td>AI 도구 사용법 학습</td><td>도구를 배워도 실제 업무 적용 주제가 명확하지 않음</td></tr>
                        <tr><td>활용 사례 공유</td><td>사례는 쌓였지만 개인별 업무 문제와 연결이 약함</td></tr>
                        <tr><td>실습 중심 모임</td><td>실습 결과가 지속적인 결과물로 남기 어려움</td></tr>
                        <tr><td>자발적 참여</td><td>참여 열정은 있었지만 과제 추진 구조가 부족함</td></tr>
                        <tr><td>월 1회 모임</td><td>활동 사이클이 느리고 실행 관리가 어려움</td></tr>
                    </tbody>
                </table></div>
                <div class="bg-beige rounded-lg p-4 mt-5 text-sm">핵심 한계 — 학습은 있었지만 <strong class="bg-pug px-1 rounded">문제 정의와 실행 구조</strong>가 부족했습니다.</div>`
            }),

            contentSlide({
                label: '2026 Direction · 개선',
                title: '2026년 개선 사항 — 인터뷰로 이어지는 전환',
                message: '2025년 회고를 바탕으로 PUG의 질문을 바꿨습니다. <strong class="text-ink">"AI를 어떻게 쓰는가?"</strong>에서 <strong class="text-ink">"AI로 어떤 업무 문제를 해결할 수 있는가?"</strong>로. 다음 단계는 <strong class="text-ink">사전 인터뷰</strong>를 통해 멤버별 니즈를 파악하고, 맞춤형 커리큘럼과 PoC로 연결하는 것입니다.',
                body: `<div class="bg-card rounded-lg p-6"><table class="tbl">
                    <thead><tr><th>구분</th><th>2025년</th><th>2026년</th></tr></thead>
                    <tbody>
                        <tr><td>활동 중심</td><td>AI 도구 학습</td><td class="col-2026">현업 문제 해결 PoC</td></tr>
                        <tr><td>주제 선정</td><td>공통 학습 주제 중심</td><td class="col-2026">멤버별 업무 Pain Point 기반</td></tr>
                        <tr><td>참여 방식</td><td>관심 기반 참여</td><td class="col-2026">사전 인터뷰 기반 선정 및 역할 부여</td></tr>
                        <tr><td>결과물</td><td>학습 경험, 활용 팁</td><td class="col-2026">PoC 결과물, 개선 아이디어</td></tr>
                    </tbody>
                </table></div>`
            })
        ];

        }

        function setRadarModeButtons(mode) {
            document.querySelectorAll('.radar-mode-btn[data-radar-mode]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.radarMode === mode);
            });
        }

        function updateGrowthDetailList(activeIdx = activeGrowthIdx) {
            const list = document.getElementById('growth-detail-list');
            const avgEl = document.getElementById('growth-avg-delta');
            if (!list) return;

            const isBefore = growthListMode === 'before';
            if (avgEl) avgEl.textContent = isBefore ? '' : `평균 +${growthListMode === 'after' ? getFinalAvgDelta() : getAvgDelta()}%`;

            list.innerHTML = GROWTH.map((g, i) => {
                const val = Math.round(growthCurrentValues[i]);
                const delta = g.m5 - g.m3;
                const active = i === activeIdx ? ' active' : '';
                const currentDelta = Math.max(0, val - g.m3);
                return `<button type="button" class="growth-dim-row w-full text-left p-3 rounded-lg hover:bg-beige transition${active}" data-dim-idx="${i}">
                    <div class="flex justify-between items-center text-xs font-bold mb-1.5">
                        <span>${g.area}</span>
                        <span class="text-pug min-w-[3rem] text-right">${isBefore ? '' : `+${growthListMode === 'after' ? delta : currentDelta}%`}</span>
                    </div>
                    <div class="grid grid-cols-[1fr_auto] items-center gap-2 text-[11px]">
                        <div class="h-2 bg-beige rounded-full overflow-hidden relative">
                            <div class="absolute inset-y-0 left-0 bg-ink/30 rounded-full" style="width:${g.m3}%"></div>
                            <div class="absolute inset-y-0 left-0 bg-pug rounded-full" style="width:${val}%"></div>
                        </div>
                        <span class="text-ink font-bold w-12 text-right tabular-nums">${val}%</span>
                    </div>
                    <div class="flex justify-between text-[10px] text-taupe mt-1 px-0.5">
                        <span>0%</span><span>100%</span>
                    </div>
                </button>`;
            }).join('');
        }

        function highlightGrowthDimension(idx, { listOnly = false } = {}) {
            activeGrowthIdx = idx;
            updateGrowthDetailList(idx);
            if (!growthRadarInstance || listOnly) return;

            const activeEls = radarMode === 'after'
                ? [{ datasetIndex: 0, index: idx }, { datasetIndex: 1, index: idx }]
                : [{ datasetIndex: 0, index: idx }];
            growthRadarInstance.setActiveElements(activeEls);
            growthRadarInstance.tooltip.setActiveElements(activeEls, { x: 0, y: 0 });
            growthRadarInstance.update('none');
        }

        function resetToBefore() {
            growthListMode = 'before';
            growthCurrentValues = GROWTH.map(g => g.m3);
            activeGrowthIdx = -1;
            radarMode = 'before';
            if (growthRadarInstance) {
                growthRadarInstance.data.datasets[0].hidden = false;
                growthRadarInstance.data.datasets[1].hidden = true;
                growthRadarInstance.data.datasets[1].data = getGrowthAfter();
                growthRadarInstance.update();
            }
            setRadarModeButtons('before');
            updateGrowthDetailList(-1);
        }

        function stopRadarAutoLoop() {
            if (radarAutoTimer) {
                clearTimeout(radarAutoTimer);
                radarAutoTimer = null;
            }
        }

        function stopRadarSlide() {
            stopRadarAutoLoop();
            stopGrowthAnimation();
        }

        function startRadarAutoLoop() {
            stopRadarAutoLoop();
            resetToBefore();

            function showAfter() {
                playGrowthAnimation(() => {
                    radarAutoTimer = setTimeout(showBefore, RADAR_HOLD_AFTER);
                });
            }

            function showBefore() {
                resetToBefore();
                radarAutoTimer = setTimeout(showAfter, RADAR_HOLD_BEFORE);
            }

            radarAutoTimer = setTimeout(showAfter, RADAR_HOLD_BEFORE);
        }

        function stopGrowthAnimation() {
            if (radarAnimFrame) {
                cancelAnimationFrame(radarAnimFrame);
                radarAnimFrame = null;
            }
            radarAnimating = false;
        }

        function playGrowthAnimation(onComplete) {
            if (!growthRadarInstance || radarAnimating) return;
            stopGrowthAnimation();

            growthListMode = 'animating';
            growthCurrentValues = GROWTH.map(g => g.m3);
            activeGrowthIdx = -1;
            radarMode = 'after';
            setRadarModeButtons('after');

            growthRadarInstance.data.datasets[0].hidden = false;
            growthRadarInstance.data.datasets[1].hidden = false;
            growthRadarInstance.data.datasets[1].data = [...getGrowthBefore()];
            growthRadarInstance.update('none');
            updateGrowthDetailList(-1);

            const before = getGrowthBefore();
            const after = getGrowthAfter();
            const duration = RADAR_GROWTH_DURATION;
            const start = performance.now();
            radarAnimating = true;

            function frame(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                growthCurrentValues = before.map((b, i) => Math.round(b + (after[i] - b) * eased));
                growthRadarInstance.data.datasets[1].data = [...growthCurrentValues];
                growthRadarInstance.update('none');
                updateGrowthDetailList(-1);

                if (t < 1) {
                    radarAnimFrame = requestAnimationFrame(frame);
                } else {
                    growthListMode = 'after';
                    growthCurrentValues = [...after];
                    growthRadarInstance.data.datasets[1].data = [...after];
                    growthRadarInstance.update();
                    radarAnimating = false;
                    radarAnimFrame = null;
                    activeGrowthIdx = -1;
                    updateGrowthDetailList(-1);
                    if (onComplete) onComplete();
                }
            }

            radarAnimFrame = requestAnimationFrame(frame);
        }

        function renderGrowthRadar() {
            const canvas = document.getElementById('growthRadar');
            if (!canvas || typeof Chart === 'undefined') return;

            if (growthRadarInstance) {
                growthRadarInstance.resize();
                updateGrowthDetailList();
                return;
            }

            growthRadarInstance = new Chart(canvas.getContext('2d'), {
                type: 'radar',
                data: {
                    labels: GROWTH.map(g => g.chart || g.area),
                    datasets: [
                        { label: 'Before', data: getGrowthBefore(), fill: true, backgroundColor: 'rgba(51,39,31,0.08)', borderColor: 'rgba(51,39,31,0.80)', pointBackgroundColor: 'rgba(51,39,31,1)', pointBorderColor: '#FFF', borderWidth: 2, pointRadius: 4, pointHoverRadius: 6 },
                        { label: 'After', data: getGrowthAfter(), hidden: true, fill: true, backgroundColor: 'rgba(245,176,65,0.35)', borderColor: 'rgba(245,176,65,1)', pointBackgroundColor: 'rgba(245,176,65,1)', pointBorderColor: '#33271F', borderWidth: 3, pointRadius: 4, pointHoverRadius: 6 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#33271F',
                            titleColor: '#FFFFFF',
                            bodyColor: '#F0EAE0',
                            padding: 12,
                            callbacks: {
                                label(ctx) {
                                    return `${ctx.dataset.label}: ${ctx.raw}%`;
                                },
                                afterBody(items) {
                                    const before = items.find(i => i.dataset.label === 'Before');
                                    const after = items.find(i => i.dataset.label === 'After');
                                    if (before && after) return [`변화: +${after.raw - before.raw}%`];
                                    return [];
                                }
                            }
                        }
                    },
                    scales: {
                        r: {
                            min: 0, max: 100,
                            angleLines: { color: 'rgba(51,39,31,0.12)' },
                            grid: { color: 'rgba(51,39,31,0.12)' },
                            pointLabels: { color: '#33271F', font: { family: 'Noto Sans KR', size: 10, weight: 'bold' } },
                            ticks: { backdropColor: 'transparent', color: '#8A7B6E', font: { size: 10 }, stepSize: 20 }
                        }
                    },
                    onHover(_evt, elements) {
                        if (elements.length && elements[0].index !== activeGrowthIdx) {
                            highlightGrowthDimension(elements[0].index);
                        }
                    },
                    onClick(_evt, elements) {
                        if (elements.length) highlightGrowthDimension(elements[0].index);
                    }
                }
            });

            updateGrowthDetailList();
            resetToBefore();
        }

        function initGrowthInteractive() {
            if (growthInteractiveReady) return;
            growthInteractiveReady = true;

            document.addEventListener('click', e => {
                const modeBtn = e.target.closest('.radar-mode-btn[data-radar-mode]');
                if (modeBtn) {
                    e.stopPropagation();
                    stopRadarAutoLoop();
                    if (modeBtn.dataset.radarMode === 'after') {
                        playGrowthAnimation();
                    } else {
                        stopGrowthAnimation();
                        resetToBefore();
                    }
                    return;
                }

                const dimRow = e.target.closest('.growth-dim-row');
                if (dimRow) {
                    e.stopPropagation();
                    highlightGrowthDimension(+dimRow.dataset.dimIdx);
                }
            });
        }

        // ── Navigation ──
        const slides = Array.from(document.querySelectorAll('.slide'));
        let current = 0;
        document.getElementById('total').innerText = slides.length;

        function render() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === current);
                if (i !== current) s.querySelectorAll('video').forEach(v => v.pause());
            });
            if (!slides[current]?.querySelector('#growthRadar')) stopRadarSlide();
            if (!slides[current]?.querySelector('#tech-stack-panel')) stopStackAutoLoop();
            document.getElementById('cur').innerText = current + 1;
            document.getElementById('progress-bar').style.width = ((current + 1) / slides.length * 100) + '%';
            lucide.createIcons();
            if (slides[current]?.querySelector('#growthRadar')) {
                renderGrowthRadar();
                initGrowthInteractive();
                growthRadarInstance?.resize();
                startRadarAutoLoop();
            } else if (slides[current]?.querySelector('#checklist-body')) {
                renderChecklistBody();
            } else if (slides[current]?.querySelector('#tech-stack-panel')) {
                initTechStackInteractive();
            }
        }
        function changeSlide(dir) {
            const next = current + dir;
            if (next < 0 || next >= slides.length) return;
            current = next; render();
        }
        document.addEventListener('keydown', e => {
            if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); changeSlide(1); }
            else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); changeSlide(-1); }
            else if (e.key === 'Home') { current = 0; render(); }
            else if (e.key === 'End') { current = slides.length - 1; render(); }
        });
        render();
    </script>
</body>
</html>
