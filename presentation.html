<body class="bg-paper text-ink antialiased overflow-hidden">

    <div class="fixed top-0 left-0 right-0 h-1 bg-beige z-50">
        <div id="progress-bar" class="h-full bg-pug transition-all duration-300" style="width:0%"></div>
    </div>

    <main id="deck" class="w-full h-screen"></main>

    <div class="deck-nav fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 bg-card rounded-full px-2.5 py-1">
        <button onclick="goToPart('part1')" class="p-1.5 rounded-full hover:bg-beige text-ink transition" aria-label="목차" title="PART 1 (T)">
            <i data-lucide="list" class="w-4 h-4"></i>
        </button>
        <button onclick="changeSlide(-1)" class="p-1.5 rounded-full hover:bg-beige text-ink transition" aria-label="이전">
            <i data-lucide="chevron-left" class="w-4 h-4"></i>
        </button>
        <span class="text-sm font-semibold text-ink tabular-nums px-1">
            <span id="cur">1</span><span class="text-taupe"> / <span id="total">0</span></span>
        </span>
        <button onclick="changeSlide(1)" class="p-1.5 rounded-full hover:bg-beige text-ink transition" aria-label="다음">
            <i data-lucide="chevron-right" class="w-4 h-4"></i>
        </button>
    </div>

    <div class="fixed top-5 left-6 z-40 flex items-center gap-2 text-sm font-bold text-ink/70">
        <span class="bg-pug text-ink px-2 py-0.5 rounded text-xs">🐶 PUG</span>
        <span class="hidden md:inline">AI PUG 성장 히스토리</span>
    </div>

    <script src="presenter-sync.js"></script>
    <script>
        const IS_EMBED = new URLSearchParams(location.search).get('embed') === '1';
        if (IS_EMBED) {
            document.documentElement.classList.add('embed-root');
            document.body.classList.add('embed-mode');
        }

        const deck = document.getElementById('deck');

        // ── Slide builders ──
        const PARTS = [ 
            { id: 'part1', badge: 'PART 1', title: 'PUG 출범 · 2025 활동', subtitle: '어떻게 시작했고, 무엇이 부족했는가', tocLabel: 'PUG 출범과 2025년 회고' },
            { id: 'part2', badge: 'PART 2', title: '인터뷰 · 커리큘럼 · 교육', subtitle: '업무 요구사항 파악부터 맞춤형 학습까지', tocLabel: '2026년 PUG 활동' },
            { id: 'part3', badge: 'PART 3', title: '디지털전략센터 X PUG ', subtitle: '사내 전문가 연결과 운영 지원', tocLabel: '디지털전략센터 지원 전략' },
            { id: 'part4', badge: 'PART 4', title: '활동 · 효과 · 변화', subtitle: '서로 얻어가는 성장과 조직에 남긴 변화', tocLabel: 'PUG 활동 성과와 변화' }
        ];

        function buildTocSlide() {
            const items = PARTS.map((entry, i) =>
                `<button type="button" class="toc-cell" data-part="${entry.id}" aria-label="${entry.tocLabel}로 이동">
                    <span class="toc-cell__num">${String(i + 1).padStart(2, '0')}</span>
                    <span class="toc-cell__label">${entry.tocLabel}</span>
                </button>`
            ).join('');
            return `<section class="slide slide-toc w-full h-screen flex-col px-8 lg:px-24" data-part="toc">
                <div class="toc-wrap">
                    <p class="toc-eyebrow">Contents</p>
                    <h2 class="toc-title">목차</h2>
                    <div class="toc-tray">
                        <div class="toc-panel" id="toc-list">${items}</div>
                    </div>
                </div>
            </section>`;
        }

        function sectionDivider(part, title, subtitle, partId = '', { active = false } = {}) {
            const dataAttr = partId ? ` data-part="${partId}"` : '';
            const activeCls = active ? ' active' : '';
            return `<section class="slide${activeCls} w-full h-screen flex-col items-center justify-center px-8"${dataAttr}>
                <div class="max-w-3xl w-full text-center flex flex-col items-center gap-6">
                    <div class="inline-flex items-center gap-2 bg-ink text-card px-4 py-2 rounded-lg text-sm font-bold">${part}</div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-tight">${title}</h1>
                    ${subtitle ? `<p class="text-base text-taupe max-w-xl leading-relaxed">${subtitle}</p>` : ''}
                </div>
            </section>`;
        }

        function contentSlide({ label, title, message, body, scroll = false, wide = false, alignTop = false, compact = false, titleExtra, slideClass = '', partId = '', headAside = '' }) {
            const scrollCls = scroll ? ' py-12 overflow-y-auto' : '';
            const alignCls = alignTop ? ' justify-start pt-6 pb-16 overflow-hidden' : ' justify-center pb-14';
            const maxW = wide ? 'max-w-6xl' : 'max-w-5xl';
            const titleCls = compact ? 'text-4xl font-extrabold mb-2 leading-tight' : 'text-4xl font-extrabold mb-3';
            const msgMb = compact ? 'mb-4' : 'mb-7';
            const titleBlock = titleExtra
                ? `<div class="slide-title-row shrink-0"><h2 class="${titleCls.replace(' mb-2', '').replace(' mb-3', '')}">${title}</h2>${titleExtra}</div>`
                : `<h2 class="${titleCls} shrink-0">${title}</h2>`;
            const messageBlock = message
                ? `<p class="slide-msg text-sm text-ink/80 leading-relaxed shrink-0">${message}</p>`
                : '';
            const headBlock = headAside
                ? `<div class="slide-head-row">
                    <div class="slide-head-main">${titleBlock}${messageBlock}</div>
                    ${headAside}
                </div>`
                : `${titleBlock}${message ? `<p class="slide-msg text-sm text-ink/80 leading-relaxed ${msgMb} shrink-0">${message}</p>` : ''}`;
            const slideExtraCls = slideClass ? ` ${slideClass}` : '';
            const partAttr = partId ? ` data-part="${partId}"` : '';
            return `<section class="slide w-full h-screen flex-col${alignCls} px-8 lg:px-24${scrollCls}${slideExtraCls}"${partAttr}>
                <div class="${maxW} w-full mx-auto min-h-0${alignTop ? ' flex flex-col flex-1 overflow-hidden' : ''}">
                    <p class="text-sm font-bold text-pug mb-2 uppercase tracking-wider shrink-0">${label}</p>
                    ${headBlock}
                    <div class="${alignTop ? 'min-h-0 flex-1 overflow-hidden flex flex-col' : ''}">${body}</div>
                </div>
            </section>`;
        }

        function buildPerspectiveItem(text) {
            return `<li class="perspective-panel__item"><span class="perspective-panel__mark" aria-hidden="true"></span><span class="perspective-panel__text">${text}</span></li>`;
        }

        function buildPerspectivePanel(title, items) {
            return `<div class="bg-card rounded-lg perspective-panel"><p class="perspective-panel__title">${title}</p><ul class="perspective-panel__list">${items.map(buildPerspectiveItem).join('')}</ul></div>`;
        }

        function buildPainMergeBody() {
            const pillars = [
                {
                    title: '현업 솔루션 개발을 위한 기획 세션',
                    points: ['현업 문제 도출', 'AI 접목 + 해결 방향 도출', '문제의 크기, 성공 기준 정의']
                },
                {
                    title: 'AI 활용 역량 향상을 위한 커리큘럼',
                    points: ['인터뷰를 통한 성장 방향성 파악', 'AI 활용도 향상을 위한 커리큘럼 설계', '웹 개발 & AI 기초 강의 지원']
                },
                {
                    title: '개인 산출물 관리를 위한 버전 관리 교육',
                    points: ['Git · GitHub 활용법 안내', '개인 단위 산출물 이력 관리', '변경 추적 · 백업으로 산출물 보호']
                }
            ];
            const supports = ['실무형 코칭', '보안 가이드 제공', '디전센 기술 전문가 매칭'];
            const pillarBlocks = pillars.map((item, idx) =>
                `<article class="strategy-ops__pillar">
                    <div class="strategy-ops__pillar-head">
                        <span class="strategy-ops__num">${String(idx + 1).padStart(2, '0')}</span>
                        <h3 class="strategy-ops__pillar-title">${item.title}</h3>
                    </div>
                    <ul class="strategy-ops__list">${item.points.map(p => `<li>${p}</li>`).join('')}</ul>
                </article>`
            ).join('');
            const supportBlocks = supports.map((label) =>
                `<div class="strategy-support__item">${label}</div>`
            ).join('');
            return `<div class="pain-merge" id="pain-review-grid">
                <div class="strategy-board">
                    <div class="strategy-main">
                        <aside class="strategy-cadence">
                            <h3 class="strategy-kicker">모임 주기</h3>
                            <div class="strategy-cadence__values">
                                <p class="strategy-cadence__value">주 1회</p>
                                <p class="strategy-cadence__value">Full 타임</p>
                            </div>
                            <p class="strategy-cadence__note">정기 모임으로<br>실행 리듬 고정</p>
                        </aside>
                        <section class="strategy-ops">
                            <div class="strategy-ops__pillars">${pillarBlocks}</div>
                        </section>
                    </div>
                    <footer class="strategy-support">
                        <h3 class="strategy-kicker">COMMON 공통 지원사항 · <span>3가지</span></h3>
                        <div class="strategy-support__grid">${supportBlocks}</div>
                    </footer>
                </div>
            </div>`;
        }

        function buildSupportOverviewBody() {
            const cards = [
                {
                    title: '온라인 강의 선별',
                    sub: '필요한 강의만 선별',
                    body: 'LLM 이론 · GitHub · n8n 자동화 · 바이브 코딩'
                },
                {
                    title: 'AI 도구 구독 지원',
                    sub: '유료 도구 · API 키 지원',
                    body: 'Google AI Pro · OpenAI · SerpApi'
                },
                {
                    title: '산출물·버전 관리 가이드',
                    sub: 'GitHub Organization',
                    body: '산출물 이력 관리 · 표준 기술스택 가이드'
                },
                {
                    title: 'IT 기초 서적 배부',
                    sub: '공통 언어 만들기',
                    body: '비전공자를 위한 이해할 수 있는 IT 지식'
                },
                {
                    title: '사내 Infra 활용 가이드',
                    sub: 'AI Playground 안내',
                    body: '사내 LLM 환경에서 안전하게 실험'
                },
                {
                    title: 'API 개발 지원',
                    sub: 'API Playground',
                    body: 'Outlook · Teams 연동을 실제 PoC에 연결',
                    soft: true
                }
            ];
            const cardBlocks = cards.map((c) =>
                `<article class="support-overview__card${c.soft ? ' support-overview__card--soft' : ''}">
                    <h3 class="support-overview__card-title">${c.title}</h3>
                    <p class="support-overview__card-sub">${c.sub}</p>
                    <p class="support-overview__card-body">${c.body}</p>
                </article>`
            ).join('');
            const experts = [
                { role: 'Web · Infra', name: '디지털진화팀 송영복', src: 'assets/48-experts/expert-1-song-youngbok.png' },
                { role: 'AI · Data', name: 'AI솔루션팀 윤채영', src: 'assets/48-experts/expert-2-yoon-chaeyeong.png' },
                { role: 'AI · LLM', name: 'AI솔루션팀 진완혁', src: 'assets/48-experts/expert-3-jin-wanhyeok.png' },
                { role: 'Design · UI/UX', name: '디지털진화팀 심수정', src: 'assets/48-experts/expert-4-shim-sujeong.png' }
            ];
            const expertBlocks = experts.map((e) =>
                `<article class="support-overview__expert">
                    <p class="support-overview__expert-role">${e.role}</p>
                    <p class="support-overview__expert-name">${e.name}</p>
                    <figure class="support-overview__expert-photo">
                        <img src="${e.src}" alt="${e.role} · ${e.name}" loading="lazy">
                    </figure>
                </article>`
            ).join('');
            return `<div class="support-overview">
                <aside class="support-overview__hero">

        const RADAR_HOLD_BEFORE = 1200;

        function destroyMemberRadars() {
            stopMemberRadarSlide();
            memberRadarInstances.forEach(c => c.destroy());
            memberRadarInstances = [];
        }

        function resetMemberRadarsToBefore() {
            memberRadarInstances.forEach((chart, i) => {
                chart.data.datasets[0].hidden = false;
                chart.data.datasets[1].hidden = true;

        function stopMemberRadarAnimation() {

        }

        function stopMemberRadarAutoLoop() {

                memberRadarAutoTimer = null;
            }
        }

        function stopMemberRadarSlide() {
            stopMemberRadarAutoLoop();
            stopMemberRadarAnimation();

        function playMemberRadarAnimation(onComplete) {
            if (!memberRadarInstances.length || memberRadarAnimating) return;
            stopMemberRadarAnimation();

            memberRadarInstances.forEach((chart, i) => {
                chart.data.datasets[0].hidden = false;
                chart.data.datasets[1].hidden = false;
                chart.data.datasets[1].data = [...MEMBER_GROWTH[i].before];
                chart.update('none');
            });

            const start = performance.now();
            memberRadarAnimating = true;

            function frame(now) {
                const t = Math.min(1, (now - start) / RADAR_GROWTH_DURATION);
                const eased = 1 - Math.pow(1 - t, 3);
                memberRadarInstances.forEach((chart, i) => {
                    const before = MEMBER_GROWTH[i].before;
                    const after = MEMBER_GROWTH[i].after;
                    chart.data.datasets[1].data = before.map((b, j) => Math.round(b + (after[j] - b) * eased));
                    chart.update('none');
                });
                if (t < 1) {
                    memberRadarAnimFrame = requestAnimationFrame(frame);
                } else {
                    memberRadarInstances.forEach((chart, i) => {
                        chart.data.datasets[1].data = [...MEMBER_GROWTH[i].after];
                        chart.update();
                    });
                    memberRadarAnimating = false;
                    onComplete?.();
                }
            }
            memberRadarAnimFrame = requestAnimationFrame(frame);
        }

                });

            function showBefore() {

        function getEmbedScrollContainer(iframe) {

        function postEmbedScrollMessage(iframe, action) {
            if (!iframe) return;
            try {
                iframe.contentWindow?.postMessage({
                    type: 'pug-embed-scroll',
                    action,
                    speed: EMBED_SCROLL_SPEED,
                    pause: EMBED_SCROLL_TURN_PAUSE_MS,
                    startPause: EMBED_SCROLL_START_PAUSE_MS,
                    stepPx: EMBED_SCROLL_STEP_PX,
                    stepPause: EMBED_SCROLL_STEP_PAUSE_MS,
                    stops: embedScrollStops
                }, '*');
            } catch (_) {}
        }

        function scaleEmbedStops(stops, zoom, maxScroll) {
            if (!Array.isArray(stops) || !stops.length) return null;
            const z = zoom > 0 ? zoom : 1;
            const scaled = stops
                .map(v => Math.max(0, Math.min(maxScroll, Math.round(Number(v) * z))))
                .filter((y, i, arr) => y > 16 && (i === 0 || y > arr[i - 1] + 24));
            if (maxScroll > 0 && (scaled.length === 0 || scaled[scaled.length - 1] < maxScroll - 24)) {
                scaled.push(maxScroll);
            }
            return scaled.length ? scaled : null;
        }

        function nextEmbedStepTarget(pos, maxScroll, stepPx, stops, stopIndex) {
            if (stops && stopIndex < stops.length) return stops[stopIndex];
            return Math.min(maxScroll, pos + stepPx);
        }

        function runEmbedStepScrollTick(s, ts, maxScroll, applyPos) {
            if (ts < s.pauseUntil) return;

            if (s.resetPending) {
                s.resetPending = false;
                s.pos = 0;
                applyPos(0);
                s.stopIndex = 0;
                s.stepTarget = nextEmbedStepTarget(0, maxScroll, s.stepPx, s.stops, 0);
                s.lastTs = ts;
                return;
            }

            const dt = Math.min(ts - s.lastTs, 48) / 1000;
            s.lastTs = ts;
            s.pos += EMBED_SCROLL_SPEED * dt;

            if (s.pos < s.stepTarget) {
                applyPos(s.pos);
                return;
            }

            s.pos = Math.min(s.pos, s.stepTarget);
            applyPos(s.pos);

            if (s.pos >= maxScroll - 0.5) {
                s.pos = maxScroll;
                applyPos(s.pos);
                s.resetPending = true;
                s.pauseUntil = ts + EMBED_SCROLL_TURN_PAUSE_MS;
            } else {
                s.stopIndex += 1;
                s.stepTarget = nextEmbedStepTarget(s.pos, maxScroll, s.stepPx, s.stops, s.stopIndex);
                s.pauseUntil = ts + s.stepPause;
            }
        }

        function startParentEmbedScroll(iframe, contentHeight, stops) {
            stopParentEmbedScrollLoop();
            const prep = layoutEmbedFromReport(iframe, contentHeight);
            if (!prep) return false;

            const zoom = getIframeZoom(iframe);
            const stopList = scaleEmbedStops(stops, zoom, prep.maxScroll);

            prep.container.scrollTop = 0;
            activeEmbedIframe = iframe;
            embedScrollMode = 'parent';

            embedScrollState = {
                prep,
                maxScroll: prep.maxScroll,
                pos: 0,
                resetPending: false,
                stepPx: EMBED_SCROLL_STEP_PX,
                stepPause: EMBED_SCROLL_STEP_PAUSE_MS,
                stops: stopList,
                stopIndex: 0,
                stepTarget: nextEmbedStepTarget(0, prep.maxScroll, EMBED_SCROLL_STEP_PX, stopList, 0),
                pauseUntil: performance.now() + EMBED_SCROLL_START_PAUSE_MS,
                lastTs: performance.now()
            };

            const tick = (ts) => {
                const s = embedScrollState;
                if (!s || s.prep.iframe !== iframe || embedScrollMode !== 'parent') return;
                if (s.maxScroll < 16) return;

                runEmbedStepScrollTick(s, ts, s.maxScroll, (pos) => setEmbedScrollPosition(s.prep, pos));
                embedScrollRaf = requestAnimationFrame(tick);
            };

            embedScrollRaf = requestAnimationFrame(tick);
            return true;
        }

        function beginEmbedAutoScroll(iframe, contentHeight, stops) {
            if (!slides[current]?.contains(iframe)) return false;

            return startIframeEmbedScroll(iframe);
        }

        function getIframeZoom(iframe) {
            const z = parseFloat(getComputedStyle(iframe).zoom);
            return Number.isFinite(z) && z > 0 ? z : 1;
        }

        function layoutEmbedFromReport(iframe, contentHeight) {
            if (!contentHeight || contentHeight < 80) return null;
            try {
                const zoom = getIframeZoom(iframe);
                iframe.style.height = `${Math.ceil(contentHeight * zoom)}px`;
                iframe.style.width = '100%';
                iframe.style.display = 'block';
                const container = getEmbedScrollContainer(iframe);
                if (!container || container.clientHeight < 40) return null;
                void iframe.offsetHeight;
                void container.offsetHeight;
                const maxScroll = Math.max(0, container.scrollHeight - container.clientHeight);
                if (maxScroll < 16) return null;
                return { container, iframe, maxScroll };
            } catch (_) {
                return null;
            }
        }

        function setEmbedScrollPosition(prep, pos) {
            prep.container.scrollTop = Math.round(pos);
        }

        function stopParentEmbedScrollLoop() {
            if (embedScrollRaf) {
                cancelAnimationFrame(embedScrollRaf);
                embedScrollRaf = null;
            }
            embedScrollState = null;
            if (embedScrollMode === 'parent') embedScrollMode = null;
        }

        function detachEmbedScrollListener() {
            if (embedScrollMessageHandler) {
                window.removeEventListener('message', embedScrollMessageHandler);
                embedScrollMessageHandler = null;
            }
        }

        function stopEmbedAutoScroll() {
            if (embedScrollStartTimer) {
                clearTimeout(embedScrollStartTimer);
                embedScrollStartTimer = null;
            }
            if (embedScrollReadyTimer) {
                clearTimeout(embedScrollReadyTimer);
                embedScrollReadyTimer = null;
            }
            detachEmbedScrollListener();
            stopParentEmbedScrollLoop();
            if (activeEmbedIframe) {
                postEmbedScrollMessage(activeEmbedIframe, 'stop');
                activeEmbedIframe = null;
            }
            embedScrollMode = null;
        }

        function startIframeEmbedScroll(iframe) {
            activeEmbedIframe = iframe;
            embedScrollMode = 'iframe';
            postEmbedScrollMessage(iframe, 'start');
            return true;
        }

        function postConventionTab(iframe, tab) {
            if (!iframe || !tab) return;
            try {
                iframe.contentWindow?.postMessage({
                    type: 'pug-convention-tab',
                    tab
                }, '*');
            } catch (_) {}
        }

        function stopConventionTabLoop() {
            if (conventionTabTimer) {
                clearInterval(conventionTabTimer);
                conventionTabTimer = null;
            }
        }

        function startConventionTabLoop() {
            stopConventionTabLoop();
            const iframe = slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR);
            if (!iframe) return;

            const sendCurrent = () => {
                postConventionTab(iframe, CONVENTION_TABS[conventionTabIndex % CONVENTION_TABS.length]);
            };

            sendCurrent();
            conventionTabTimer = setInterval(() => {
                const iframeNow = slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR);
                if (!iframeNow) {
                    stopConventionTabLoop();
                    return;
                }
                conventionTabIndex = (conventionTabIndex + 1) % CONVENTION_TABS.length;
                postConventionTab(iframeNow, CONVENTION_TABS[conventionTabIndex]);
            }, CONVENTION_TAB_INTERVAL_MS);

            if (iframe.dataset.conventionTabBound !== '1') {
                iframe.dataset.conventionTabBound = '1';
                iframe.addEventListener('load', () => {
                    conventionTabIndex = 0;
                    const iframeLoaded = slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR);
                    if (iframeLoaded) postConventionTab(iframeLoaded, CONVENTION_TABS[0]);
                });
            }
        }

        function initConventionGuideTab() {
            conventionTabIndex = 0;
            startConventionTabLoop();
            const iframe = slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR);
            if (iframe) setTimeout(() => postConventionTab(iframe, CONVENTION_TABS[0]), 120);
        }

        const EMBED_SCROLL_MANUAL_SELECTOR = '[data-embed-scroll-manual]';

        function resetEmbedScrollManual() {
            slides.forEach(s => {
                const wrap = s.querySelector(EMBED_SCROLL_MANUAL_SELECTOR);
                if (!wrap) return;
                wrap.classList.remove('is-scroll-active');
                const container = wrap.querySelector('.week-guide-embed__scaler');
                if (container) container.scrollTop = 0;
                const btn = wrap.querySelector('#embed-scroll-btn');
                if (btn) btn.classList.remove('is-hidden');
            });
        }

        function initEmbedScrollManual() {
            resetEmbedScrollManual();
            const wrap = slides[current]?.querySelector(EMBED_SCROLL_MANUAL_SELECTOR);
            const btn = wrap?.querySelector('#embed-scroll-btn');
            if (!btn || !wrap) return;

            btn.onclick = () => {
                wrap.classList.add('is-scroll-active');
                btn.classList.add('is-hidden');
                initEmbedAutoScroll();
            };
        }

        function initEmbedAutoScroll() {
            const iframe = slides[current]?.querySelector(EMBED_SCROLL_SELECTOR);
            if (!iframe) return;

            stopEmbedAutoScroll();

            let started = false;
            const startOnce = (contentHeight, stops) => {
                if (started || !slides[current]?.contains(iframe)) return;
                started = true;
                if (embedScrollReadyTimer) {
                    clearTimeout(embedScrollReadyTimer);
                    embedScrollReadyTimer = null;
                }
                embedScrollStartTimer = setTimeout(() => {
                    embedScrollStartTimer = null;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            beginEmbedAutoScroll(iframe, contentHeight, stops);
                        });
                    });
                }, EMBED_SCROLL_SETTLE_MS);
            };

            embedScrollMessageHandler = (e) => {
                const d = e.data;
                if (!d || d.type !== 'pug-embed-scroll' || d.action !== 'ready') return;
                if (e.source !== iframe.contentWindow) return;
                startOnce(d.contentHeight, d.stops);
            };
            window.addEventListener('message', embedScrollMessageHandler);

            const requestReady = () => postEmbedScrollMessage(iframe, 'request-ready');

            if (iframe.dataset.embedScrollBound !== '1') {
                iframe.dataset.embedScrollBound = '1';
                iframe.addEventListener('load', requestReady);
            }

            requestReady();

            embedScrollReadyTimer = setTimeout(() => {
                embedScrollReadyTimer = null;
                if (!started && slides[current]?.contains(iframe)) {
                    startOnce(null);
                }
            }, EMBED_SCROLL_READY_TIMEOUT_MS);
        }

        function render() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === current);
            });
            stopEmbedAutoScroll();
            manageSlideVideos();
            if (!slides[current]?.querySelector('#tech-stack-panel')) stopStackAutoLoop();
            if (!slides[current]?.querySelector('#meeting-reveal')) resetMeetingReveal();
            if (!slides[current]?.querySelector('#member-radar-grid')) destroyMemberRadars();
            if (!slides[current]?.querySelector('#checklist-panel')) stopChecklistAutoLoop();
            if (!slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR)) stopConventionTabLoop();
            document.getElementById('cur').innerText = current + 1;
            document.getElementById('progress-bar').style.width = ((current + 1) / slides.length * 100) + '%';
            publishSlideSync();
            lucide.createIcons();
            if (slides[current]?.querySelector('#checklist-panel')) {
                renderChecklistBody();
                initChecklistInteractive();
            } else if (slides[current]?.querySelector('#tech-stack-panel')) {
                initTechStackInteractive();
            } else if (slides[current]?.querySelector('#meeting-reveal')) {
                initMeetingReveal();
            } else if (slides[current]?.querySelector('#member-radar-grid')) {
                renderMemberRadars();
                startMemberRadarAutoLoop();
            } else if (slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR)) {
                initConventionGuideTab();
            } else if (slides[current]?.querySelector('#practice-exchange-panel')) {
                syncPracticeExchangeHeights();
                requestAnimationFrame(syncPracticeExchangeHeights);
            } else if (slides[current]?.querySelector(EMBED_SCROLL_MANUAL_SELECTOR)) {
                initEmbedScrollManual();
            } else if (slides[current]?.querySelector(EMBED_SCROLL_SELECTOR)) {
                initEmbedAutoScroll();
            } else {
                resetEmbedScrollManual();
            }
        }
        function goToSlideIndex(index) {
            if (index < 0 || index >= slides.length) return;
            current = index;
            render();
        }

        function goToPart(partId) {
            const idx = slides.findIndex(s => s.dataset.part === partId);
            if (idx >= 0) goToSlideIndex(idx);
        }

        function initTocNavigation() {
            document.getElementById('toc-list')?.addEventListener('click', e => {
                const btn = e.target.closest('.toc-cell[data-part]');
                if (!btn) return;
                goToPart(btn.dataset.part);
            });
        }

        function changeSlide(dir) {
            const next = current + dir;
            if (next < 0 || next >= slides.length) return;
            current = next; render();
        }
        window.goToPart = goToPart;
        window.changeSlide = changeSlide;
        if (!IS_EMBED) document.addEventListener('keydown', e => {
            if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); changeSlide(1); }
            else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); changeSlide(-1); }
            else if (e.key === 'Home') { current = 0; render(); }
            else if (e.key === 'End') { current = slides.length - 1; render(); }
            else if (e.key === 't' || e.key === 'T') { goToPart('part1'); }
        });
        window.addEventListener('resize', () => {
            if (slides[current]?.querySelector('#practice-exchange-panel')) syncPracticeExchangeHeights();
        });
        initTocNavigation();

        if (typeof PugDeckSync !== 'undefined') {
            PugDeckSync.subscribe((slide) => {
                if (slide === current) return;
                syncFromExternal = true;
                goToSlideIndex(slide);
                syncFromExternal = false;
            });
            const saved = PugDeckSync.read();
            if (saved && Number.isInteger(saved.slide) && saved.slide >= 0 && saved.slide < slides.length) {
                syncFromExternal = true;
                goToSlideIndex(saved.slide);
                syncFromExternal = false;
            }
        }

        render();
    </script>
</body>
</html>
