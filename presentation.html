        .design-consult-photos { height: 100%; min-height: 0; }

        .toc-panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #fff; border-radius: 8px; overflow: hidden; }
        .toc-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 0.55rem; padding: 1.65rem 1.5rem; background: #fff; border: none; cursor: pointer; transition: background 0.2s; font-family: inherit; text-align: left; min-height: 7.5rem; }
        .toc-cell:nth-child(1) { border-right: 1px solid #F0EAE0; border-bottom: 1px solid #F0EAE0; }
        .toc-cell:nth-child(2) { border-bottom: 1px solid #F0EAE0; }

        .toc-cell__num { display: inline-flex; align-items: center; justify-content: center; background: #33271F; color: #fff; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.05em; padding: 0.22rem 0.5rem; border-radius: 4px; }
        .toc-cell__label { font-size: 1.2rem; font-weight: 700; color: #33271F; line-height: 1.35; }
        @media (max-width: 640px) {
            .toc-panel { grid-template-columns: 1fr; }

        body.embed-mode .fixed.bottom-5,
        body.embed-mode .fixed.top-5.left-6,

        html.embed-root, body.embed-mode { height: 100%; overflow: hidden; }
        body.embed-mode #deck { height: 100%; }
        body.embed-mode .slide { height: 100% !important; min-height: 0; }

<body class="bg-paper text-ink antialiased overflow-hidden">

    <div class="fixed top-0 left-0 right-0 h-1 bg-beige z-50">
        <div id="progress-bar" class="h-full bg-pug transition-all duration-300" style="width:0%"></div>
    </div>

    <main id="deck" class="w-full h-screen"></main>

    <div id="case-demo-modal" class="case-demo-modal" aria-hidden="true">
        <div class="case-demo-modal__panel" role="dialog" aria-modal="true" aria-labelledby="case-demo-title">
            <div class="case-demo-modal__head">
                <span id="case-demo-title" class="case-demo-modal__title">실무 사례 · DRB 핵심가치 체험 게임</span>
                <button type="button" id="case-demo-close" class="case-demo-modal__close">닫기</button>
            </div>
            <div class="case-demo-modal__media">
                <img src="assets/05-2025-activities/drb-core-value-game.png" alt="DRB 핵심가치 체험 게임" class="case-demo-modal__img" loading="lazy">
            </div>
        </div>
    </div>

    <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 bg-card rounded-full px-3 py-2">
        <button onclick="goToPart('toc')" class="p-2 rounded-full hover:bg-beige text-ink transition" aria-label="목차" title="목차 (T)">
            <i data-lucide="list" class="w-5 h-5"></i>
        </button>
        <button onclick="changeSlide(-1)" class="p-2 rounded-full hover:bg-beige text-ink transition" aria-label="이전">
            <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <span class="text-sm font-semibold text-ink tabular-nums px-1">
            <span id="cur">1</span><span class="text-taupe"> / <span id="total">0</span></span>
        </span>
        <button onclick="changeSlide(1)" class="p-2 rounded-full hover:bg-beige text-ink transition" aria-label="다음">
            <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
    </div>

    <div class="fixed top-5 left-6 z-40 flex items-center gap-2 text-sm font-bold text-ink/70">
        <span class="bg-pug text-ink px-2 py-0.5 rounded text-xs">🐶 PUG</span>
        <span class="hidden md:inline">AI PUG 성장 히스토리</span>
    </div>

    <script src="presenter-sync.js"></script>
    <script>
        const IS_EMBED = new URLSearchParams(location.search).get('embed') === '1';
        if (IS_EMBED) {
            document.documentElement.classList.add('embed-root');
            document.body.classList.add('embed-mode');
        }

        const deck = document.getElementById('deck');

        // ── Slide builders ──
        const PARTS = [
            { id: 'part1', badge: 'PART 1', title: 'PUG 출범 · 2025 활동', subtitle: '어떻게 시작했고, 무엇이 부족했는가', tocLabel: '시작과 회고' },
            { id: 'part2', badge: 'PART 2', title: '인터뷰 · 커리큘럼 · 교육', subtitle: '업무 요구사항 파악부터 맞춤형 학습까지', tocLabel: '학습과 교육' },
            { id: 'part3', badge: 'PART 3', title: '디지털전략센터 · PUG · 지원', subtitle: '사내 전문가 연결과 운영 지원', tocLabel: '조직 지원' },
            { id: 'part4', badge: 'PART 4', title: '활동 · 효과 · 변화', subtitle: '서로 얻어가는 성장과 조직에 남긴 변화', tocLabel: '성과와 변화' }
        ];

        function buildTocSlide() {
            const items = PARTS.map((entry, i) =>
                `<button type="button" class="toc-cell" data-part="${entry.id}" aria-label="${entry.tocLabel}로 이동">
                    <span class="toc-cell__num">${String(i + 1).padStart(2, '0')}</span>
                    <span class="toc-cell__label">${entry.tocLabel}</span>
                </button>`
            ).join('');
            return `<section class="slide slide-toc w-full h-screen flex-col px-8 lg:px-24" data-part="toc">
                <div class="toc-wrap">
                    <p class="toc-eyebrow">Contents</p>
                    <h2 class="toc-title">목차</h2>
                    <div class="toc-tray">
                        <div class="toc-panel" id="toc-list">${items}</div>
                    </div>
                </div>
            </section>`;
        }

        function sectionDivider(part, title, subtitle, partId = '') {
            const dataAttr = partId ? ` data-part="${partId}"` : '';
            return `<section class="slide w-full h-screen flex-col items-center justify-center px-8"${dataAttr}>
                <div class="max-w-3xl w-full text-center flex flex-col items-center gap-6">
                    <div class="inline-flex items-center gap-2 bg-ink text-card px-4 py-2 rounded-lg text-sm font-bold">${part}</div>
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight leading-tight">${title}</h1>
                    ${subtitle ? `<p class="text-base text-taupe max-w-xl leading-relaxed">${subtitle}</p>` : ''}
                </div>
            </section>`;
        }

        function contentSlide({ label, title, message, body, scroll = false, wide = false, alignTop = false, compact = false, titleExtra, slideClass = '', partId = '' }) {
            const scrollCls = scroll ? ' py-12 overflow-y-auto' : '';
            const alignCls = alignTop ? ' justify-start pt-6 pb-16 overflow-hidden' : ' justify-center pb-14';
            const maxW = wide ? 'max-w-6xl' : 'max-w-5xl';
            const titleCls = compact ? 'text-3xl font-extrabold mb-2 leading-tight' : 'text-4xl font-extrabold mb-3';
            const msgMb = compact ? 'mb-4' : 'mb-7';
            const titleBlock = titleExtra
                ? `<div class="slide-title-row shrink-0"><h2 class="${titleCls.replace(' mb-2', '').replace(' mb-3', '')}">${title}</h2>${titleExtra}</div>`
                : `<h2 class="${titleCls} shrink-0">${title}</h2>`;
            const slideExtraCls = slideClass ? ` ${slideClass}` : '';
            const partAttr = partId ? ` data-part="${partId}"` : '';
            return `<section class="slide w-full h-screen flex-col${alignCls} px-8 lg:px-24${scrollCls}${slideExtraCls}"${partAttr}>
                <div class="${maxW} w-full mx-auto min-h-0${alignTop ? ' flex flex-col flex-1 overflow-hidden' : ''}">
                    <p class="text-sm font-bold text-pug mb-2 uppercase tracking-wider shrink-0">${label}</p>
                    ${titleBlock}
                    ${message ? `<p class="text-sm text-ink/80 leading-relaxed ${msgMb} max-w-3xl shrink-0">${message}</p>` : ''}
                    <div class="${alignTop ? 'min-h-0 flex-1 overflow-hidden flex flex-col' : ''}">${body}</div>
                </div>
            </section>`;
        }

        function buildPerspectiveItem(text) {
            return `<li class="perspective-panel__item"><span class="shrink-0 mt-0.5 p-0.5 bg-pug text-ink rounded perspective-panel__check"><i data-lucide="check"></i></span><span class="perspective-panel__text">${text}</span></li>`;
        }

        function buildPerspectivePanel(title, items) {
            return `<div class="bg-card rounded-lg perspective-panel"><p class="perspective-panel__title">${title}</p><ul class="perspective-panel__list">${items.map(buildPerspectiveItem).join('')}</ul></div>`;
        }

        function listSlide({ label, title, message, items, highlight, footer, scroll, listLayout, compact, alignTop, wide }) {
            const isGrid = listLayout === 'grid';
            const list = items.map(i => {
                const icon = `<span class="shrink-0 ${isGrid ? 'p-0.5' : 'mt-0.5 p-1'} bg-pug text-ink rounded"><i data-lucide="check" class="${isGrid ? 'w-2.5 h-2.5' : 'w-3 h-3'}"></i></span>`;
                const liCls = isGrid
                    ? 'flex items-center gap-1.5 text-xs md:text-[0.8125rem] text-ink/85 leading-snug'
                    : 'flex items-start gap-2.5 text-sm text-ink/85';
                return `<li class="${liCls}">${icon}<span>${i}</span></li>`;
            }).join('');
            const listCls = isGrid ? 'list-slide-grid' : 'space-y-3';
            const cardPad = isGrid ? 'p-3' : 'p-6';
            const highlightMt = isGrid ? 'mt-0' : 'mt-5';
            const highlightPad = isGrid ? 'px-3 py-2.5' : 'p-4';
            const highlightText = isGrid ? 'text-xs md:text-sm' : 'text-sm';
            const card = `<div class="bg-card rounded-lg ${cardPad} shrink-0"><ul class="${listCls}">${list}</ul></div>`;
            const highlightBlock = highlight ? `<div class="bg-beige rounded-lg ${highlightPad} ${highlightMt} ${highlightText} text-ink leading-relaxed shrink-0">${highlight}</div>` : '';
            const bodyInner = `${card}${highlightBlock}${footer || ''}`;
            const body = isGrid && footer
                ? `<div class="flex flex-col min-h-0 h-full gap-2.5">${bodyInner}</div>`
                : bodyInner;
            return contentSlide({
                label, title, message, scroll, compact, alignTop, wide,
                body
            });
        }

        const PRACTICE_QUESTIONS = [
            { tag: 'API·문서', q: 'FastAPI로 API 문서를 만드는 이유는?', take: '코드 기반 자동 문서화·Swagger로 요청/응답 공유' },
            { tag: '백엔드', q: 'POST 호출 시 req 변수를 쓰는 이유는?', take: '요청 본문을 담는 request의 관습적 변수명' },
            { tag: '기초 개념', q: '인코딩이란?', take: '문자를 숫자로 변환하는 방식, UTF-8·EUC-KR 등' },
            { tag: '기초 개념', q: '로케일(locale)이란?', take: '언어·지역 설정, 날짜·숫자 표기에 영향' },
            { tag: 'SQL', q: 'SELECT alias를 WHERE 절에서 쓸 수 있나?', take: 'alias는 SELECT 결과에만 적용, 서브쿼리 활용' },
            { tag: 'DB 선택·운영', q: '데이터베이스는 어디에 구축되나?', take: '별도 서버 환경(물리·클라우드)에 운영' },
            { tag: 'SQL', q: 'SQL 실행 후 저장 없이 DB에 반영되나?', take: '실행 즉시 반영, 스크립트 파일 저장과 별개' }
        ];

        const PRACTICE_DISCUSSIONS = [
            {
                tag: 'API·문서',
                title: 'API 문서의 실무 유즈케이스',
                points: ['프론트·백엔드 연동 사전 검증', 'Swagger에서 URL·요청·응답 직접 테스트']
            },
            {
                tag: 'DB 선택·운영',
                title: 'MongoDB·Supabase·SQL 차이와 선택',
                points: ['관계형 vs NoSQL 특성 비교', '업무·데이터 성격에 따른 기술 검토']
            },
            {
                tag: '데이터 설계',
                title: '데이터 테이블 효과적 설계',
                points: ['데이터 중복 최소화', '테이블 관계·PK/FK 구조 설계']
            }
        ];

        function renderPracticeQuestionItem(item) {
            return `<article class="practice-exchange-item">
                <div class="practice-exchange-item__meta">
                    <span class="practice-exchange-item__tag">${item.tag}</span>
                </div>
                <p class="practice-exchange-item__q">${item.q}</p>
                <p class="practice-exchange-item__take">${item.take}</p>
            </article>`;
        }

        function renderPracticeDiscussionItem(item) {
            return `<article class="practice-exchange-item">
                <div class="practice-exchange-item__meta">
                    <span class="practice-exchange-item__tag">${item.tag}</span>
                </div>
                <p class="practice-exchange-item__title">${item.title}</p>
                <ul class="practice-exchange-item__points">${item.points.map(p => `<li>${p}</li>`).join('')}</ul>
            </article>`;
        }

        function buildPracticeExchangeBody() {
            return `<div class="practice-exchange-layout" id="practice-exchange-panel">
                <div class="practice-exchange-columns">
                    <section class="practice-exchange-col practice-exchange-col--question">
                        <header class="practice-exchange-col__head">
                            <h3 class="practice-exchange-col__title">❓ 질문 · 개념 정리</h3>
                        </header>
                        <div class="practice-exchange-col__list">${PRACTICE_QUESTIONS.map(renderPracticeQuestionItem).join('')}</div>
                        <figure class="practice-exchange-col__figure">
                            <img src="assets/43-practice-exchange/practice-questions.png" alt="실습 중 개념 질문 일러스트">
                        </figure>
                    </section>
                    <section class="practice-exchange-col practice-exchange-col--discussion">
                        <header class="practice-exchange-col__head">
                            <h3 class="practice-exchange-col__title">💬 토론 · 관점 나누기</h3>
                        </header>
                        <div class="practice-exchange-col__list">${PRACTICE_DISCUSSIONS.map(renderPracticeDiscussionItem).join('')}</div>
                        <figure class="practice-exchange-col__figure">
                            <img src="assets/43-practice-exchange/practice-discussions.png" alt="실습 중 관점 나누기 일러스트">
                        </figure>
                    </section>
                </div>
            </div>`;
        }

        function syncPracticeExchangeHeights() {
            const panel = document.getElementById('practice-exchange-panel');
            if (!panel) return;
            const qList = panel.querySelector('.practice-exchange-col--question .practice-exchange-col__list');
            const dList = panel.querySelector('.practice-exchange-col--discussion .practice-exchange-col__list');
            if (!qList || !dList) return;
            qList.style.height = '';
            dList.style.height = '';
            const listH = dList.scrollHeight;
            dList.style.height = `${listH}px`;
            qList.style.height = `${listH}px`;
        }

        function buildInterviewSlide() {
            const goals = [
                '각 구성원의 AI 적용 업무 요구사항 파악',
                '현재 AI·자동화 활용 수준 확인',
                '희망 학습 주제와 성장 방향 확인',
                '참여 가능 시간과 제약 조건 파악',
                'PoC 수행을 위한 지원 방식 설계'
            ];
            const goalItems = goals.map(g =>
                `<li class="interview-goal-item"><span class="interview-goal-check"><i data-lucide="check"></i></span><span>${g}</span></li>`
            ).join('');
            return contentSlide({
                label: 'Interview · 사전 인터뷰',
                title: '선정 멤버 사전 인터뷰',
                message: 'PoC 수행 가능성과 필요한 지원 사항을 확인하기 위한 과정이었습니다.',
                wide: true,
                compact: true,
                slideClass: 'slide-interview',
                body: `<div class="interview-body">
                    <div class="interview-goals-box">
                        <p class="interview-goals-title">🎯 인터뷰에서 확인한 것</p>
                        <ul class="interview-goals-grid">${goalItems}</ul>
                    </div>

                return `<div class="stack-item">

            }).join('');

            document.querySelectorAll('.stack-tab').forEach(btn => {

            document.querySelectorAll('.stack-panel-view').forEach(view => {

                selectStackCategory(STACK_CAT_ORDER[idx], { fromAuto: true });

                const val = Math.round(growthCurrentValues[i]);
                const delta = g.m5 - g.m3;
                const active = i === activeIdx ? ' active' : '';
                const currentDelta = Math.max(0, val - g.m3);
                return `<button type="button" class="growth-dim-row w-full text-left rounded-lg hover:bg-beige transition${active}" data-dim-idx="${i}">

        function stopGrowthAnimation() {
            if (radarAnimFrame) {
                cancelAnimationFrame(radarAnimFrame);

        function playGrowthAnimation(onComplete) {
            if (!growthRadarInstance || radarAnimating) return;
            stopGrowthAnimation();

            growthListMode = 'animating';
            growthCurrentValues = GROWTH.map(g => g.m3);
            activeGrowthIdx = -1;
            radarMode = 'after';
            setRadarModeButtons('after');

            growthRadarInstance.data.datasets[0].hidden = false;
            growthRadarInstance.data.datasets[1].hidden = false;
            growthRadarInstance.data.datasets[1].data = [...getGrowthBefore()];
            growthRadarInstance.update('none');
            updateGrowthDetailList(-1);

            const before = getGrowthBefore();
            const after = getGrowthAfter();
            const duration = RADAR_GROWTH_DURATION;
            const start = performance.now();
            radarAnimating = true;

            function frame(now) {
                const t = Math.min(1, (now - start) / duration);
                const eased = 1 - Math.pow(1 - t, 3);
                growthCurrentValues = before.map((b, i) => Math.round(b + (after[i] - b) * eased));
                growthRadarInstance.data.datasets[1].data = [...growthCurrentValues];
                growthRadarInstance.update('none');
                updateGrowthDetailList(-1);

                if (t < 1) {
                    radarAnimFrame = requestAnimationFrame(frame);
                } else {
                    growthListMode = 'after';
                    growthCurrentValues = [...after];
                    growthRadarInstance.data.datasets[1].data = [...after];
                    growthRadarInstance.update();
                    radarAnimating = false;
                    radarAnimFrame = null;
                    activeGrowthIdx = -1;
                    updateGrowthDetailList(-1);
                    if (onComplete) onComplete();
                }
            }

            radarAnimFrame = requestAnimationFrame(frame);
        }

        const EMBED_SCROLL_SELECTOR = '.embed-scroll-iframe';
        const CONVENTION_GUIDE_SELECTOR = '.week-guide-embed--convention .week-guide-iframe';
        const CONVENTION_DEFAULT_TAB = 'git';
        const EMBED_SCROLL_SPEED = 170;
        const EMBED_SCROLL_START_PAUSE_MS = 80;
        const EMBED_SCROLL_SETTLE_MS = 320;
        const EMBED_SCROLL_STEP_PX = 240;
        const EMBED_SCROLL_STEP_PAUSE_MS = 560;
        const EMBED_SCROLL_TURN_PAUSE_MS = 780;
        const EMBED_SCROLL_READY_TIMEOUT_MS = 4000;
        let embedScrollRaf = null;
        let embedScrollState = null;
        let embedScrollStartTimer = null;
        let embedScrollReadyTimer = null;
        let activeEmbedIframe = null;
        let embedScrollMode = null;
        let embedScrollMessageHandler = null;

        function getEmbedScrollContainer(iframe) {
            return iframe.closest('.week-guide-embed__scaler, .design-guide-scaler, .notion-embed-wrap') || iframe.parentElement;
        }

        function postEmbedScrollMessage(iframe, action) {
            if (!iframe) return;
            try {
                iframe.contentWindow?.postMessage({
                    type: 'pug-embed-scroll',
                    action,
                    speed: EMBED_SCROLL_SPEED,
                    pause: EMBED_SCROLL_TURN_PAUSE_MS,
                    startPause: EMBED_SCROLL_START_PAUSE_MS,
                    stepPx: EMBED_SCROLL_STEP_PX,
                    stepPause: EMBED_SCROLL_STEP_PAUSE_MS
                }, '*');
            } catch (_) {}
        }

        function getIframeZoom(iframe) {
            const z = parseFloat(getComputedStyle(iframe).zoom);
            return Number.isFinite(z) && z > 0 ? z : 1;
        }

        function layoutEmbedFromReport(iframe, contentHeight) {
            if (!contentHeight || contentHeight < 80) return null;
            try {
                const zoom = getIframeZoom(iframe);
                iframe.style.height = `${Math.ceil(contentHeight * zoom)}px`;
                iframe.style.width = '100%';
                iframe.style.display = 'block';
                const container = getEmbedScrollContainer(iframe);
                if (!container || container.clientHeight < 40) return null;
                void iframe.offsetHeight;
                void container.offsetHeight;
                const maxScroll = Math.max(0, container.scrollHeight - container.clientHeight);
                if (maxScroll < 16) return null;
                return { container, iframe, maxScroll };
            } catch (_) {
                return null;
            }
        }

        function setEmbedScrollPosition(prep, pos) {
            prep.container.scrollTop = Math.round(pos);
        }

        function stopParentEmbedScrollLoop() {
            if (embedScrollRaf) {
                cancelAnimationFrame(embedScrollRaf);
                embedScrollRaf = null;
            }
            embedScrollState = null;
            if (embedScrollMode === 'parent') embedScrollMode = null;
        }

        function detachEmbedScrollListener() {
            if (embedScrollMessageHandler) {
                window.removeEventListener('message', embedScrollMessageHandler);
                embedScrollMessageHandler = null;
            }
        }

        function stopEmbedAutoScroll() {
            if (embedScrollStartTimer) {
                clearTimeout(embedScrollStartTimer);
                embedScrollStartTimer = null;
            }
            if (embedScrollReadyTimer) {
                clearTimeout(embedScrollReadyTimer);
                embedScrollReadyTimer = null;
            }
            detachEmbedScrollListener();
            stopParentEmbedScrollLoop();
            if (activeEmbedIframe) {
                postEmbedScrollMessage(activeEmbedIframe, 'stop');
                activeEmbedIframe = null;
            }
            embedScrollMode = null;
        }

        function startIframeEmbedScroll(iframe) {
            activeEmbedIframe = iframe;
            embedScrollMode = 'iframe';
            postEmbedScrollMessage(iframe, 'start');
            return true;
        }

        function nextEmbedStepTarget(pos, maxScroll, stepPx) {
            return Math.min(maxScroll, pos + stepPx);
        }

        function runEmbedStepScrollTick(s, ts, maxScroll, applyPos) {
            if (ts < s.pauseUntil) return;

            if (s.resetPending) {
                s.resetPending = false;
                s.pos = 0;
                applyPos(0);
                s.stepTarget = Math.min(s.stepPx, maxScroll);
                s.lastTs = ts;
                return;
            }

            const dt = Math.min(ts - s.lastTs, 48) / 1000;
            s.lastTs = ts;
            s.pos += EMBED_SCROLL_SPEED * dt;

            if (s.pos < s.stepTarget) {
                applyPos(s.pos);
                return;
            }

            s.pos = Math.min(s.pos, s.stepTarget);
            applyPos(s.pos);

            if (s.pos >= maxScroll - 0.5) {
                s.pos = maxScroll;
                applyPos(s.pos);
                s.resetPending = true;
                s.pauseUntil = ts + EMBED_SCROLL_TURN_PAUSE_MS;
            } else {
                s.stepTarget = nextEmbedStepTarget(s.pos, maxScroll, s.stepPx);
                s.pauseUntil = ts + s.stepPause;
            }
        }

        function startParentEmbedScroll(iframe, contentHeight) {
            stopParentEmbedScrollLoop();
            const prep = layoutEmbedFromReport(iframe, contentHeight);
            if (!prep) return false;

            prep.container.scrollTop = 0;
            activeEmbedIframe = iframe;
            embedScrollMode = 'parent';

            embedScrollState = {
                prep,
                maxScroll: prep.maxScroll,
                pos: 0,
                resetPending: false,
                stepPx: EMBED_SCROLL_STEP_PX,
                stepPause: EMBED_SCROLL_STEP_PAUSE_MS,
                stepTarget: Math.min(EMBED_SCROLL_STEP_PX, prep.maxScroll),
                pauseUntil: performance.now() + EMBED_SCROLL_START_PAUSE_MS,
                lastTs: performance.now()
            };

            const tick = (ts) => {
                const s = embedScrollState;
                if (!s || s.prep.iframe !== iframe || embedScrollMode !== 'parent') return;
                if (s.maxScroll < 16) return;

                runEmbedStepScrollTick(s, ts, s.maxScroll, (pos) => setEmbedScrollPosition(s.prep, pos));
                embedScrollRaf = requestAnimationFrame(tick);
            };

            embedScrollRaf = requestAnimationFrame(tick);
            return true;
        }

        function beginEmbedAutoScroll(iframe, contentHeight) {

            if (startParentEmbedScroll(iframe, contentHeight)) return true;
            return startIframeEmbedScroll(iframe);

            resetEmbedScrollManual();
            const wrap = slides[current]?.querySelector(EMBED_SCROLL_MANUAL_SELECTOR);
            const btn = wrap?.querySelector('#embed-scroll-btn');
            if (!btn || !wrap) return;

            btn.onclick = () => {
                wrap.classList.add('is-scroll-active');
                btn.classList.add('is-hidden');
                initEmbedAutoScroll();
            };
        }

        function initEmbedAutoScroll() {
            const iframe = slides[current]?.querySelector(EMBED_SCROLL_SELECTOR);
            if (!iframe) return;

            stopEmbedAutoScroll();

            let started = false;
            const startOnce = (contentHeight) => {
                if (started || !slides[current]?.contains(iframe)) return;
                started = true;
                if (embedScrollReadyTimer) {
                    clearTimeout(embedScrollReadyTimer);
                    embedScrollReadyTimer = null;
                }
                embedScrollStartTimer = setTimeout(() => {
                    embedScrollStartTimer = null;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            beginEmbedAutoScroll(iframe, contentHeight);
                        });
                    });
                }, EMBED_SCROLL_SETTLE_MS);
            };

            embedScrollMessageHandler = (e) => {
                const d = e.data;
                if (!d || d.type !== 'pug-embed-scroll' || d.action !== 'ready') return;
                if (e.source !== iframe.contentWindow) return;
                startOnce(d.contentHeight);
            };
            window.addEventListener('message', embedScrollMessageHandler);

            const requestReady = () => postEmbedScrollMessage(iframe, 'request-ready');

            if (iframe.dataset.embedScrollBound !== '1') {
                iframe.dataset.embedScrollBound = '1';
                iframe.addEventListener('load', requestReady);
            }

            requestReady();

            embedScrollReadyTimer = setTimeout(() => {
                embedScrollReadyTimer = null;
                if (!started && slides[current]?.contains(iframe)) {
                    startOnce(null);
                }
            }, EMBED_SCROLL_READY_TIMEOUT_MS);
        }

        function render() {
            slides.forEach((s, i) => {
                s.classList.toggle('active', i === current);
            });
            stopEmbedAutoScroll();
            manageSlideVideos();
            if (!slides[current]?.querySelector('#growthRadar')) stopRadarSlide();
            if (!slides[current]?.querySelector('#tech-stack-panel')) stopStackAutoLoop();
            if (!slides[current]?.querySelector('#pain-review-grid')) resetPainReveal();
            if (!slides[current]?.querySelector('#meeting-reveal')) resetMeetingReveal();
            if (!slides[current]?.querySelector('#case-demo-btn')) resetCaseDemoModal();
            if (!slides[current]?.querySelector('#member-radar-grid')) destroyMemberRadars();
            if (!slides[current]?.querySelector('#checklist-panel')) stopChecklistAutoLoop();
            document.getElementById('cur').innerText = current + 1;
            document.getElementById('progress-bar').style.width = ((current + 1) / slides.length * 100) + '%';
            publishSlideSync();
            lucide.createIcons();
            if (slides[current]?.querySelector('#growthRadar')) {
                renderGrowthRadar();
                initGrowthInteractive();
                growthRadarInstance?.resize();
                startRadarAutoLoop();
            } else if (slides[current]?.querySelector('#checklist-panel')) {
                renderChecklistBody();
                initChecklistInteractive();
            } else if (slides[current]?.querySelector('#tech-stack-panel')) {
                initTechStackInteractive();
            } else if (slides[current]?.querySelector('#pain-review-grid')) {
                initPainReveal();
            } else if (slides[current]?.querySelector('#meeting-reveal')) {
                initMeetingReveal();
            } else if (slides[current]?.querySelector('#case-demo-btn')) {
                initCaseDemoModal();
            } else if (slides[current]?.querySelector('#member-radar-grid')) {
                renderMemberRadars();
                startMemberRadarAutoLoop();
            } else if (slides[current]?.querySelector(CONVENTION_GUIDE_SELECTOR)) {
                initConventionGuideTab();
            } else if (slides[current]?.querySelector('#practice-exchange-panel')) {
                syncPracticeExchangeHeights();
                requestAnimationFrame(syncPracticeExchangeHeights);
            } else if (slides[current]?.querySelector(EMBED_SCROLL_MANUAL_SELECTOR)) {
                initEmbedScrollManual();
            } else if (slides[current]?.querySelector(EMBED_SCROLL_SELECTOR)) {
                initEmbedAutoScroll();
            } else {
                resetEmbedScrollManual();
            }
        }
        function goToSlideIndex(index) {
            if (index < 0 || index >= slides.length) return;
            current = index;
            render();
        }

        function goToPart(partId) {
            const idx = slides.findIndex(s => s.dataset.part === partId);
            if (idx >= 0) goToSlideIndex(idx);
        }

        function initTocNavigation() {
            document.getElementById('toc-list')?.addEventListener('click', e => {
                const btn = e.target.closest('.toc-cell[data-part]');
                if (!btn) return;
                goToPart(btn.dataset.part);
            });
        }

        function changeSlide(dir) {
            const next = current + dir;
            if (next < 0 || next >= slides.length) return;
            current = next; render();
        }
        window.goToPart = goToPart;
        window.changeSlide = changeSlide;
        if (!IS_EMBED) document.addEventListener('keydown', e => {
            if (document.getElementById('case-demo-modal')?.classList.contains('is-open')) {
                if (e.key === 'Escape') { e.preventDefault(); closeCaseDemoModal(); }
                return;
            }
            if (['ArrowRight','PageDown',' '].includes(e.key)) { e.preventDefault(); changeSlide(1); }
            else if (['ArrowLeft','PageUp'].includes(e.key)) { e.preventDefault(); changeSlide(-1); }
            else if (e.key === 'Home') { current = 0; render(); }
            else if (e.key === 'End') { current = slides.length - 1; render(); }
            else if (e.key === 't' || e.key === 'T') { goToPart('toc'); }
        });
        window.addEventListener('resize', () => {
            if (slides[current]?.querySelector('#practice-exchange-panel')) syncPracticeExchangeHeights();
        });
        initTocNavigation();

        if (typeof PugDeckSync !== 'undefined') {
            PugDeckSync.subscribe((slide) => {
                if (slide === current) return;
                syncFromExternal = true;
                goToSlideIndex(slide);
                syncFromExternal = false;
            });
            const saved = PugDeckSync.read();
            if (saved && Number.isInteger(saved.slide) && saved.slide >= 0 && saved.slide < slides.length) {
                syncFromExternal = true;
                goToSlideIndex(saved.slide);
                syncFromExternal = false;
            }
        }

        render();
    </script>
</body>
</html>
