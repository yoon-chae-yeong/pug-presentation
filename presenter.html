<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PUG · 발표자 화면</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --pug: #F5B041; --bg: #0f0e0d; --panel: #1a1816;
            --text: rgba(255,255,255,.82); --muted: rgba(255,255,255,.45);
            --preview-height: 36vh;
        }
        * { box-sizing: border-box; }
        html { height: 100%; overflow: hidden; }
        body {
            margin: 0; height: 100%; background: var(--bg); color: var(--text);
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .top-bar {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            gap: 1rem; padding: 0.75rem 1.25rem; background: var(--panel);
            border-bottom: 1px solid rgba(255,255,255,.08);
        }
        .timer-block { display: flex; align-items: center; flex: 1; justify-content: flex-start; }
        .timer { font-size: 1.6rem; font-weight: 800; color: var(--pug); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
        .timer-idle { color: var(--muted); font-size: 1rem; font-weight: 600; }
        .top-bar__right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.45rem 0.9rem; border-radius: 9999px; border: none;
            font-size: 0.75rem; font-weight: 700; cursor: pointer; font-family: inherit;
            transition: background 0.2s, opacity 0.2s;
        }
        .btn--primary { background: var(--pug); color: #33271F; }
        .btn--primary:hover { background: #E5A030; }
        .btn--ghost { background: rgba(255,255,255,.08); color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.12); }
        .btn--ghost:hover { background: rgba(255,255,255,.14); color: #fff; }
        .btn--stop { background: rgba(255,255,255,.08); color: rgba(255,255,255,.85); border: 1px solid rgba(255,255,255,.15); }
        .btn--stop:hover { background: rgba(255,255,255,.14); color: #fff; }
        .btn i { width: 14px; height: 14px; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .main {
            flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
        }
        .slide-preview {
            flex: 0 0 auto; height: var(--preview-height); min-height: 140px;
            min-width: 0; display: flex; flex-direction: column;
            padding: 0.55rem 1rem 0.5rem; gap: 0.4rem;
            background: rgba(0,0,0,.25); overflow: hidden;
        }
        .pane-resizer {
            flex-shrink: 0; height: 8px; margin: 0; padding: 0; border: 0;
            background: rgba(255,255,255,.04); cursor: row-resize; touch-action: none;
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .pane-resizer::after {
            content: ''; width: 52px; height: 4px; border-radius: 999px;
            background: rgba(245,176,65,.35); transition: background 0.15s;
        }
        .pane-resizer:hover::after,
        .pane-resizer.is-dragging::after { background: rgba(245,176,65,.75); }
        body.is-resizing-panes { cursor: row-resize !important; user-select: none !important; }
        .slide-preview__meta {
            flex-shrink: 0; font-size: 0.72rem; font-weight: 700; color: var(--muted);
            font-variant-numeric: tabular-nums;
        }
        .slide-preview__meta span { color: var(--pug); }
        .slide-preview__wrap {
            flex: 1; min-height: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .slide-preview__frame {
            flex-shrink: 0; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(255,255,255,.12);
            background: #FBF8F3;
        }
        .slide-preview__frame iframe {
            border: 0; display: block; flex-shrink: 0;
            transform-origin: center center;
            pointer-events: none;
        }
        .script-panel {
            flex: 1; min-height: 120px; min-width: 0;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .script-head {
            flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
            padding: 0.55rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .script-head__label { font-size: 0.68rem; font-weight: 700; color: var(--pug); letter-spacing: 0.06em; text-transform: uppercase; }
        .script-head__next { font-size: 0.72rem; color: var(--muted); text-align: right; max-width: 55vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .script-head__next strong { color: rgba(255,255,255,.65); }
        .script-body {
            flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
            padding: 1.1rem 1.25rem 1.5rem;
            scrollbar-width: thin; scrollbar-color: rgba(245,176,65,.4) transparent;
        }
        .script-body::-webkit-scrollbar { width: 6px; }
        .script-body::-webkit-scrollbar-thumb { background: rgba(245,176,65,.4); border-radius: 999px; }
        .script-body::-webkit-scrollbar-thumb:hover { background: rgba(245,176,65,.6); }
        .script-text { margin: 0; font-size: 1.15rem; line-height: 1.8; word-break: keep-all; }
        .script-text .script-em { color: var(--pug); font-weight: 600; }
        .nav-bar {
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            gap: 1rem; padding: 0.85rem 1.25rem; background: var(--panel);
            border-top: 1px solid rgba(245,176,65,.2);
        }
        .nav-count { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.55); min-width: 4.5rem; text-align: center; }
        .nav-count span { color: var(--pug); }
    </style>
</head>
<body>
    <header class="top-bar">
        <div class="timer-block">
            <span id="timer" class="timer timer-idle">—:—</span>
        </div>
        <div class="top-bar__right">
            <button type="button" id="timer-toggle-btn" class="btn btn--primary"><i data-lucide="play"></i><span>발표 시작</span></button>
        </div>
    </header>

    <main class="main">
        <section class="slide-preview" aria-label="현재 슬라이드">
            <div class="slide-preview__meta">현재 <span id="current-num">1</span> / <span id="current-total">0</span></div>
            <div class="slide-preview__wrap">
                <div class="slide-preview__frame">
                    <iframe id="slide-preview" src="presentation.html?embed=1" title="현재 슬라이드 미리보기"></iframe>
                </div>
            </div>
        </section>
        <button type="button" class="pane-resizer" id="pane-resizer" aria-label="슬라이드와 스크립트 영역 크기 조절"></button>
        <div class="script-panel">
            <div class="script-head">
                <span class="script-head__label">발표 스크립트</span>
                <span id="next-hint" class="script-head__next"></span>
            </div>
            <div class="script-body" id="script-body">
                <p id="script-text" class="script-text"></p>
            </div>
        </div>
    </main>

    <footer class="nav-bar">
        <button type="button" id="prev-btn" class="btn btn--ghost" aria-label="이전"><i data-lucide="chevron-left"></i> 이전</button>
        <span id="nav-count" class="nav-count"><span>1</span> / 0</span>
        <button type="button" id="next-btn" class="btn btn--primary" aria-label="다음">다음 <i data-lucide="chevron-right"></i></button>
    </footer>

    <script src="presenter-sync.js"></script>
    <script src="slide-scripts.js"></script>
    <script>
        let total = 0;
        const PREVIEW_W = 1024;
        const PREVIEW_H = 768;
        const PREVIEW_RATIO = PREVIEW_W / PREVIEW_H;
        const PREVIEW_SCALE = 0.75;
        const PREVIEW_HEIGHT_KEY = 'pug-presenter-preview-height';
        const PREVIEW_MIN_H = 140;
        const SCRIPT_MIN_H = 120;
        let current = 0;
        let timerStartedAt = null;
        let timerElapsedMs = 0;
        let timerId = null;
        let running = false;
        let syncFromExternal = false;

        const els = {
            main: document.querySelector('.main'),
            slidePreviewSection: document.querySelector('.slide-preview'),
            paneResizer: document.getElementById('pane-resizer'),
            timer: document.getElementById('timer'),
            timerToggleBtn: document.getElementById('timer-toggle-btn'),
            currentNum: document.getElementById('current-num'),
            currentTotal: document.getElementById('current-total'),
            previewWrap: document.querySelector('.slide-preview__wrap'),
            previewFrame: document.querySelector('.slide-preview__frame'),
            slidePreview: document.getElementById('slide-preview'),
            scriptText: document.getElementById('script-text'),
            scriptBody: document.getElementById('script-body'),
            nextHint: document.getElementById('next-hint'),
            navCount: document.getElementById('nav-count'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn')
        };

        function getPreviewHeightLimits() {
            const mainH = els.main?.clientHeight || window.innerHeight;
            const resizerH = els.paneResizer?.offsetHeight || 8;
            return {
                min: PREVIEW_MIN_H,
                max: Math.max(PREVIEW_MIN_H, mainH - SCRIPT_MIN_H - resizerH)
            };
        }

        function setPreviewHeight(px, save = true) {
            const { min, max } = getPreviewHeightLimits();
            const h = Math.min(max, Math.max(min, px));
            document.documentElement.style.setProperty('--preview-height', `${h}px`);
            if (save) {
                try { localStorage.setItem(PREVIEW_HEIGHT_KEY, String(Math.round(h))); } catch (_) {}
            }
            schedulePreviewFit();
            return h;
        }

        function initPreviewHeight() {
            try {
                const saved = parseInt(localStorage.getItem(PREVIEW_HEIGHT_KEY), 10);
                if (Number.isFinite(saved) && saved > 0) {
                    setPreviewHeight(saved, false);
                    return;
                }
            } catch (_) {}
            const defaultH = Math.round((els.main?.clientHeight || window.innerHeight * 0.6) * 0.36);
            setPreviewHeight(defaultH, false);
        }

        function initPaneResizer() {
            const resizer = els.paneResizer;
            if (!resizer) return;

            let dragging = false;
            let startY = 0;
            let startH = 0;

            const onMove = (clientY) => {
                setPreviewHeight(startH + (clientY - startY));
            };

            const stopDrag = () => {
                if (!dragging) return;
                dragging = false;
                resizer.classList.remove('is-dragging');
                document.body.classList.remove('is-resizing-panes');
            };

            resizer.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                dragging = true;
                startY = e.clientY;
                startH = els.slidePreviewSection?.offsetHeight || 0;
                resizer.classList.add('is-dragging');
                document.body.classList.add('is-resizing-panes');
                e.preventDefault();
            });

            window.addEventListener('mousemove', (e) => {
                if (!dragging) return;
                onMove(e.clientY);
            });

            window.addEventListener('mouseup', stopDrag);

            resizer.addEventListener('touchstart', (e) => {
                if (!e.touches.length) return;
                dragging = true;
                startY = e.touches[0].clientY;
                startH = els.slidePreviewSection?.offsetHeight || 0;
                resizer.classList.add('is-dragging');
                document.body.classList.add('is-resizing-panes');
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!dragging || !e.touches.length) return;
                onMove(e.touches[0].clientY);
                e.preventDefault();
            }, { passive: false });

            window.addEventListener('touchend', stopDrag);
        }

        function formatElapsed(ms) {
            const sec = Math.floor(ms / 1000);
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function getTimerElapsedMs() {
            return timerElapsedMs + (running && timerStartedAt ? Date.now() - timerStartedAt : 0);
        }

        function updateTimerDisplay() {
            const ms = getTimerElapsedMs();
            if (ms > 0 || running) {
                els.timer.textContent = formatElapsed(ms);
                els.timer.classList.remove('timer-idle');
            } else {
                els.timer.textContent = '—:—';
                els.timer.classList.add('timer-idle');
            }
        }

        function tickTimer() {
            if (!running) return;
            updateTimerDisplay();
        }

        function setTimerToggleBtn(runningNow) {
            const btn = els.timerToggleBtn;
            const icon = btn.querySelector('[data-lucide]');
            const label = btn.querySelector('span');
            const paused = !runningNow && timerElapsedMs > 0;
            btn.classList.toggle('btn--primary', !runningNow);
            btn.classList.toggle('btn--stop', runningNow);
            icon.setAttribute('data-lucide', runningNow ? 'square' : 'play');
            label.textContent = runningNow ? '중지' : (paused ? '이어서 시작' : '발표 시작');
            lucide.createIcons();
        }

        function startTimer() {
            if (running) return;
            running = true;
            timerStartedAt = Date.now();
            updateTimerDisplay();
            timerId = setInterval(tickTimer, 1000);
            setTimerToggleBtn(true);
        }

        function pauseTimer() {
            if (!running) return;
            timerElapsedMs += Date.now() - timerStartedAt;
            running = false;
            timerStartedAt = null;
            if (timerId) { clearInterval(timerId); timerId = null; }
            updateTimerDisplay();
            setTimerToggleBtn(false);
        }

        function fitSlidePreview() {
            const wrap = els.previewWrap;
            const frame = els.previewFrame;
            const iframe = els.slidePreview;
            if (!wrap || !frame || !iframe) return;

            const maxW = wrap.clientWidth * PREVIEW_SCALE;
            const maxH = wrap.clientHeight * PREVIEW_SCALE;
            let frameW = maxW;
            let frameH = frameW / PREVIEW_RATIO;
            if (frameH > maxH) {
                frameH = maxH;
                frameW = frameH * PREVIEW_RATIO;
            }
            frame.style.width = `${Math.floor(frameW)}px`;
            frame.style.height = `${Math.floor(frameH)}px`;

            const scale = Math.min(frameW / PREVIEW_W, frameH / PREVIEW_H);
            iframe.style.width = `${PREVIEW_W}px`;
            iframe.style.height = `${PREVIEW_H}px`;
            iframe.style.transform = `scale(${scale})`;
        }

        function schedulePreviewFit() {
            requestAnimationFrame(() => {
                fitSlidePreview();
                requestAnimationFrame(fitSlidePreview);
            });
        }

        function toggleTimer() {
            if (running) pauseTimer();
            else startTimer();
        }

        function publishSlide() {
            if (syncFromExternal) return;
            PugDeckSync.publish(current);
        }

        function goTo(index) {
            if (index < 0 || index >= total) return;
            current = index;
            render();
            publishSlide();
        }

        function changeSlide(dir) {
            goTo(current + dir);
        }

        function render() {
            els.currentNum.textContent = current + 1;
            els.currentTotal.textContent = total;
            els.scriptText.innerHTML = SLIDE_SCRIPTS[current] || '스크립트 없음';
            els.navCount.innerHTML = `<span>${current + 1}</span> / ${total}`;
            els.prevBtn.disabled = current <= 0;
            els.nextBtn.disabled = current >= total - 1;
            if (current < total - 1) {
                els.nextHint.innerHTML = `다음 → <strong>${SLIDE_TITLES[current + 1]}</strong>`;
            } else {
                els.nextHint.textContent = '마지막 슬라이드';
            }
            els.scriptBody.scrollTop = 0;
            schedulePreviewFit();
            setTimeout(schedulePreviewFit, 400);
        }

        els.slidePreview?.addEventListener('load', schedulePreviewFit);
        window.addEventListener('resize', () => {
            const saved = parseInt(localStorage.getItem(PREVIEW_HEIGHT_KEY), 10);
            if (Number.isFinite(saved)) setPreviewHeight(saved, false);
            schedulePreviewFit();
        });
        if (typeof ResizeObserver !== 'undefined' && els.previewWrap) {
            new ResizeObserver(schedulePreviewFit).observe(els.previewWrap);
        }

        async function boot() {
            try {
                await initSlideScripts();
            } catch (err) {
                console.error(err);
                els.scriptText.textContent = `스크립트를 불러오지 못했습니다. (${err.message})`;
                els.currentTotal.textContent = '?';
                lucide.createIcons();
                return;
            }

            total = SLIDE_SCRIPTS.length;
            els.currentTotal.textContent = total;

            if (SLIDE_SCRIPTS.length !== SLIDE_TITLES.length) {
                console.warn('[발표자] 스크립트와 제목 개수가 일치하지 않습니다.');
            }

            const saved = PugDeckSync.read();
            if (saved && Number.isInteger(saved.slide) && saved.slide >= 0 && saved.slide < total) {
                current = saved.slide;
            }

            render();
            initPreviewHeight();
            initPaneResizer();
            schedulePreviewFit();
            lucide.createIcons();
        }

        boot();

        els.timerToggleBtn.addEventListener('click', toggleTimer);
        els.prevBtn.addEventListener('click', () => changeSlide(-1));
        els.nextBtn.addEventListener('click', () => changeSlide(1));

        els.scriptBody?.addEventListener('wheel', (e) => {
            const el = els.scriptBody;
            if (el.scrollHeight <= el.clientHeight + 1) return;
            const atTop = el.scrollTop <= 0;
            const atBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 1;
            if ((e.deltaY < 0 && atTop) || (e.deltaY > 0 && atBottom)) return;
            el.scrollTop += e.deltaY;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'PageDown') {
                e.preventDefault();
                changeSlide(1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                e.preventDefault();
                changeSlide(-1);
            } else if (e.key === 'Home') goTo(0);
            else if (e.key === 'End') goTo(total - 1);
        });

        PugDeckSync.subscribe((slide) => {
            if (slide === current) return;
            syncFromExternal = true;
            current = slide;
            render();
            syncFromExternal = false;
        });
    </script>
</body>
</html>
